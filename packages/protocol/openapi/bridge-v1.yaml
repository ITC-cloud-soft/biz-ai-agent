        that is still claimed. The business system never keeps the page images or the raw text in logs or audit (counts only).
      x-invariants: []
      x-optional: true
      security: [{ serviceToken: [] }]
      parameters:
        - { name: readId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentReadResult' }
      responses:
        '200':
          description: Accepted.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { const: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: x-service-token
      description: DSH (the AI plane) to the business system. A shared secret compared in constant time; the principal is "ai", never a person.
    delegationToken:
      type: apiKey
      in: header
      name: x-delegation-token
      description: Used TOGETHER with x-service-token. The principal becomes the delegated employee (AI allow-list intersected with the employee role). Alone it is rejected (service_token_required).
    bffSecret:
      type: apiKey
      in: header
      name: x-bff-secret
      description: Shared secret of the business web BFF. Required in addition to the employee session for BFF-only operations; the BFF never forwards it from browsers.
    userSessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: The employee's own web session (cookie name is system defined).
    userBearer:
      type: http
      scheme: bearer
      description: The employee's own device session (mobile apps).
  headers:
    BridgeProtocol:
      description: Protocol major version. Always "1" on every response, errors included.
      schema: { type: string, const: '1' }
  parameters:
    IdentityId: { name: identityId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ApprovalId: { name: approvalId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ProposalId: { name: proposalId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ConnectorId: { name: connectorId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' } }
    OperationId: { name: operationId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' } }
  responses:
    BadRequest:
      description: Invalid input (invalid_json, required / invalid_value with details.field, unknown_fields, platform not allowed, ...).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing or invalid credentials (authentication_required, invalid_service_token, service_token_required, invalid_delegation_token, invalid_assistant_ticket).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated but not allowed (delegation_not_permitted, insufficient_role, role_not_permitted, human_required, bff_only, identity_mismatch, ...).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Unknown or not visible to the caller (existence of other people's data is never disclosed).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: State conflict (identity_already_linked, bot_already_registered, already_<status>, delivery_used, ...).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: Expired (link_code_expired, expired).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Body too large.
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unprocessable:
      description: Well formed but refused by a business rule.
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Rate limit or lock-out (too_many_attempts, too_many_requests, delivery_locked).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Not configured or temporarily unavailable (bff_secret_not_configured).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BadGateway:
      description: An external API the business system called failed (connector_failed).
      headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error: { type: string, pattern: '^[a-z0-9_]+$', description: "Stable machine code (see x-error-codes)." }
        message: { type: string, description: Text for people; not stable. }
        details:
          type: object
          description: "Machine-readable context. `field` names the input a validation error is about (dotted path), never part of the code."
          properties:
            field: { type: string }
          additionalProperties: true
      additionalProperties: true
    Health:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
        protocol: { const: 1 }
        service: { type: string }
        version: { type: string }
      additionalProperties: true
    Manifest:
      type: object
      description: "Conforms to schema/manifest.schema.json (validate with bridge-validate manifest)."
      required: [bridge, system]
      properties:
        bridge: { const: 1 }
      additionalProperties: true
    Platform:
      type: string
      pattern: '^[a-z][a-z0-9_-]{1,31}$'
      description: "IM platform name, lower case (slack, line, weixin, ...)."
    ImSource:
      type: object
      description: "Trusted source of an inbound IM message (from the platform event, never from message text)."
      required: [platform, userId]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        teamId: { type: string, maxLength: 128 }
        userId: { type: string, minLength: 1, maxLength: 128 }
        botId: { type: string, maxLength: 128, description: "The bot the message came through (informational; used by the personal-bot owner rule)." }
      additionalProperties: true
    ImIdentity:
      type: object
      required: [platform, externalId]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        teamId: { type: string }
        externalId: { type: string }
        botId: { type: string }
      additionalProperties: false
    UserRef:
      type: object
      required: [id, role]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string }
        displayName: { type: [string, 'null'] }
      additionalProperties: false
    IdentityLookup:
      type: object
      required: [ok, linked]
      properties:
        ok: { const: true }
        linked: { type: boolean }
        orgId: { type: string }
        user: { $ref: '#/components/schemas/UserRef' }
      if: { properties: { linked: { const: false } } }
      then: { not: { required: [user] } }
      else: { required: [user] }
    LinkRequest:
      type: object
      required: [code, source]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        source: { $ref: '#/components/schemas/ImSource' }
    LinkResponse:
      type: object
      required: [ok, user]
      properties:
        ok: { const: true }
        user: { $ref: '#/components/schemas/UserRef' }
    IdentityStats:
      type: object
      required: [ok, linkedCount, linkedUsers, byPlatform]
      properties:
        ok: { const: true }
        orgId: { type: string }
        linkedCount: { type: integer, minimum: 0 }
        linkedUsers: { type: integer, minimum: 0 }
        byPlatform: { type: object, additionalProperties: { type: integer, minimum: 0 } }
      additionalProperties: false
    LinkCode:
      type: object
      required: [ok, code, expiresAt]
      properties:
        ok: { const: true }
        code: { type: string, pattern: '^[0-9]{6}$' }
        expiresAt: { type: string, format: date-time, description: "At most 10 minutes from now." }
      additionalProperties: false
    MyIdentity:
      type: object
      required: [id, platform, externalId]
      properties:
        id: { type: string }
        userId: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        teamId: { type: [string, 'null'] }
        externalId: { type: string }
        method: { type: string }
        botId: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'] }
      additionalProperties: true
    MyIdentities:
      type: object
      required: [ok, identities]
      properties:
        ok: { const: true }
        identities: { type: array, items: { $ref: '#/components/schemas/MyIdentity' } }
    Deleted:
      type: object
      required: [ok, deleted, id]
      properties:
        ok: { const: true }
        deleted: { const: true }
        id: { type: string }
        personalBotRevoked: { type: boolean }
    IdentityBot:
      type: object
      required: [ok, identity]
      properties:
        ok: { const: true }
        identity:
          type: object
          required: [id, platform]
          properties:
            id: { type: string }
            platform: { $ref: '#/components/schemas/Platform' }
            botId: { type: [string, 'null'] }
    PersonalBot:
      type: object
      required: [id, platform, botId, kind]
      properties:
        id: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        botId: { type: string }
        kind: { const: personal }
        createdAt: { type: string }
    PersonalBots:
      type: object
      required: [ok, bots]
      properties:
        ok: { const: true }
        bots: { type: array, items: { $ref: '#/components/schemas/PersonalBot' } }
    RegisterPersonalBot:
      type: object
      required: [platform, botId]
      additionalProperties: false
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        botId: { type: string, minLength: 1, maxLength: 128, pattern: '^[^\s]+$' }
    RegisteredPersonalBot:
      type: object
      required: [ok, bot, created]
      properties:
        ok: { const: true }
        bot: { $ref: '#/components/schemas/PersonalBot' }
        created: { type: boolean }
    NotificationPreferences:
      type: object
      required: [ok, preferences, types]
      properties:
        ok: { const: true }
        preferences:
          type: object
          required: [types, quietHours]
          properties:
            types: { type: object, additionalProperties: { type: object, required: [im], properties: { im: { type: boolean } } } }
            quietHours:
              type: object
              required: [enabled, start, end]
              properties:
                enabled: { type: boolean }
                start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              additionalProperties: true
            updatedAt: { type: string }
        types: { type: array, items: { type: string } }
    NotificationPreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        types: { type: object, additionalProperties: { type: object, required: [im], additionalProperties: false, properties: { im: { type: boolean } } } }
        quietHours: { type: object }
    NotificationPreferencesSaved:
      type: object
      required: [ok, preferences]
      properties:
        ok: { const: true }
        preferences: { type: object }
    DelegationRequest:
      type: object
      description: "Exactly one of source (the employee behind a linked SNS account) or event (the person a business event names; optional per-event form)."
      oneOf:
        - { required: [source] }
        - { required: [event] }
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/ImSource' }
        event:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id: { type: integer, minimum: 1, description: "The id of a business event (GET /events) that triggered the automatic task." }
    Delegation:
      type: object
      required: [ok, token, user, expiresAt]
      properties:
        ok: { const: true }
        token: { type: string, minLength: 10, maxLength: 200, description: "Opaque; shown once; never put it in logs, events or LLM context." }
        user: { $ref: '#/components/schemas/UserRef' }
        expiresAt: { type: string, format: date-time, description: "At most 5 minutes from now." }
      additionalProperties: false
    EventEnvelope:
      type: object
      description: "See schema/event-envelope.schema.json (the normative definition)."
      required: [id, type, aggregateType, aggregateId, payload, at]
      properties:
        id: { type: integer, minimum: 1 }
        type: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        payload: { type: object }
        at: { type: string, format: date-time }
      additionalProperties: false
    EventPage:
      type: object
      required: [ok, events, nextAfter]
      properties:
        ok: { const: true }
        events: { type: array, items: { $ref: '#/components/schemas/EventEnvelope' } }
        nextAfter: { type: integer, minimum: 0, description: "Id of the last event, or the request cursor when the page is empty." }
      additionalProperties: false
    NotificationRecipient:
      type: object
      required: [userId, identity, template, params]
      properties:
        userId: { type: string }
        identity: { $ref: '#/components/schemas/ImIdentity' }
        template: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+)*$', description: "A manifest template id." }
        params:
          type: object
          description: "Numbers and short time / date strings only. Never names, free text, health data or contact details."
          additionalProperties: { type: [number, string, boolean] }
        link: { type: string, maxLength: 500 }
        quietHours:
          oneOf:
            - { type: 'null' }
            - { type: object, required: [start, end, timeZone], properties: { start: { type: string }, end: { type: string }, timeZone: { type: string } } }
      additionalProperties: false
    NotificationRecipients:
      type: object
      required: [ok, eventId, type, supported, recipients]
      properties:
        ok: { const: true }
        eventId: { type: integer }
        type: { type: string }
        dedupeKey: { type: string }
        supported: { type: boolean }
        stale: { type: string, description: "The event no longer needs a notification (reason code)." }
        alreadyNotified: { type: integer, minimum: 0 }
        recipients: { type: array, items: { $ref: '#/components/schemas/NotificationRecipient' } }
    DeliveryReport:
      type: object
      required: [userId, eventIds, status]
      additionalProperties: false
      properties:
        userId: { type: string }
        eventIds: { type: array, minItems: 1, maxItems: 500, items: { type: integer, minimum: 1 } }
        status: { enum: [sent, failed, skipped, undeliverable] }
        messageRef: { type: string, maxLength: 1000 }
        errorCode: { type: string, maxLength: 60, pattern: '^[A-Za-z0-9_.:-]+$' }
        channel: { $ref: '#/components/schemas/Platform' }
    DeliveryReportResult:
      type: object
      required: [ok, updated, unchanged, unknown]
      properties:
        ok: { const: true }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        unknown: { type: array, items: { type: integer } }
    ApprovalDeliveriesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        platforms: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { $ref: '#/components/schemas/Platform' }, description: "Priority order." }
        platform: { $ref: '#/components/schemas/Platform' }
    Card:
      type: object
      required: [title]
      properties:
        title: { type: string }
        fields: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }
        body: { type: string }
        wording:
          type: object
          description: >-
            Optional sentences of this approval kind for the IM plugin (each at most 300 characters, no names or amounts):
            lead (after the greeting), ask (the request line after its label and deadline), what each button does, the reply after a button or a
            text reply, and the body of the card updated after the decision. Without it the plugin's generic sentences are used.
          properties:
            lead: { type: string, maxLength: 300 }
            ask: { type: string, maxLength: 300 }
            buttons: { type: object, properties: { approve: { type: string, maxLength: 300 }, reject: { type: string, maxLength: 300 } } }
            replies: { type: object, properties: { approved: { type: string, maxLength: 300 }, rejected: { type: string, maxLength: 300 } } }
            statusBody:
              type: object
              properties:
                approved: { type: string, maxLength: 300 }
                rejected: { type: string, maxLength: 300 }
                expired: { type: string, maxLength: 300 }
                cancelled: { type: string, maxLength: 300 }
    ApprovalDelivery:
      type: object
      required: [deliveryId, user, identity, token, replyCode, expiresAt, card]
      properties:
        deliveryId: { type: string }
        user: { type: object, required: [id], properties: { id: { type: string }, displayName: { type: [string, 'null'] } } }
        identity: { $ref: '#/components/schemas/ImIdentity' }
        token: { type: string, minLength: 10 }
        replyCode: { type: string, pattern: '^[0-9]{6}$' }
        expiresAt: { type: string }
        reused: { type: boolean }
        card: { $ref: '#/components/schemas/Card' }
        link: { type: string, format: uri, description: "Optional. The card's web link for THIS approver (e.g. a link that opens the approval page signed in as them). Used instead of the configured webUrl." }
    ApprovalDeliveries:
      type: object
      required: [ok, deliveries]
      properties:
        ok: { const: true }
        deliveries: { type: array, items: { $ref: '#/components/schemas/ApprovalDelivery' } }
    ImDecisionRequest:
      type: object
      required: [action, source]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 200 }
        replyCode: { type: string, pattern: '^[0-9]{6}$' }
        action: { enum: [approve, reject] }
        comment: { type: string, maxLength: 1000, description: "Required for reject." }
        source: { $ref: '#/components/schemas/ImSource' }
        channelMessageId: { type: string, maxLength: 1000, description: "The IM message reference (dsh-im dshim:v1:…). Teams references are close to 300 characters." }
    ImDecisionResult:
      type: object
      required: [ok, approval]
      properties:
        ok: { const: true }
        approval: { type: object }
        deliveryId: { type: string }
      additionalProperties: true
    AssistantTicket:
      type: object
      required: [ok, ticket, expiresAt, user]
      properties:
        ok: { const: true }
        ticket: { type: string, minLength: 10, maxLength: 200, description: "Opaque; shown once." }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserRef' }
      additionalProperties: false
    Report:
      type: object
      required: [date, slot, kind, sections]
      properties:
        id: { type: [string, 'null'] }
        date: { type: string }
        slot: { type: string }
        kind: { type: string }
        attention: { type: integer }
        generatedAt: { type: string }
        sections: { type: object, description: "Counts per section; never names." }
        checks: { type: array, items: { type: object } }
      additionalProperties: true
    ReportLatest:
      type: object
      required: [ok, report]
      properties:
        ok: { const: true }
        report: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Report' }] }
        source: { enum: [stored, live] }
        scope: { type: object }
        schedule: { type: object }
      additionalProperties: true
    ReportRun:
      type: object
      required: [ok, report, to]
      properties:
        ok: { const: true }
        report: { type: object }
        to: { enum: [recipients, me] }
        recipients: { type: integer }
        linkedRecipients: { type: integer }
    HelpSection:
      type: object
      required: [id, title, canOpen]
      properties:
        id: { type: string }
        title: { type: string }
        chapter: { type: string }
        menu: { type: string }
        summary: { type: string }
        steps: { type: array, items: { type: string } }
        qa: { type: array, items: { type: object, properties: { q: { type: string }, a: { type: string } } } }
        notes: { type: array, items: { type: string } }
        app: { type: [object, 'null'] }
        canOpen: { type: boolean }
        url: { type: [string, 'null'] }
        manualUrl: { type: [string, 'null'] }
        alt: { type: [string, 'null'] }
        unconfirmed: { type: array, items: { type: string } }
      additionalProperties: true
    HelpAnswer:
      type: object
      required: [ok, found, results]
      properties:
        ok: { const: true }
        query: { type: string }
        found: { type: boolean }
        results: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/HelpSection' } }
    Proposal:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { enum: [pending_review, accepted, rejected] }
        payload: { type: object }
      additionalProperties: true
    ProposalCreate:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string }
        payload: { type: object }
        confidence: { type: number, minimum: 0, maximum: 1 }
      additionalProperties: false
    AiProfile:
      type: object
      description: "The AI employee's profile (docs/AI_EMPLOYEE_PROFILE.md §2; limits AI_PROFILE_LIMITS, check validateAiProfile of @dsh-bridge/protocol)."
      required: [nickname]
      additionalProperties: false
      properties:
        nickname: { type: string, minLength: 1, maxLength: 20 }
        firstPerson: { type: string, maxLength: 10 }
        tone:
          type: object
          additionalProperties: false
          properties:
            preset: { enum: [polite, soft, concise] }
            note: { type: string, maxLength: 100 }
        company: { type: string, maxLength: 2000 }
        personality: { type: string, maxLength: 300 }
        background: { type: string, maxLength: 500 }
        examples: { type: array, maxItems: 3, items: { type: string, maxLength: 100 } }
        agents:
          type: object
          description: "Overrides per AI employee (DSH preset id): nickname / personality / background."
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              nickname: { type: string, maxLength: 20 }
              personality: { type: string, maxLength: 300 }
              background: { type: string, maxLength: 500 }
    AiProfileCurrent:
      type: object
      required: [ok, profile, version, updatedAt]
      properties:
        ok: { const: true }
        profile: { oneOf: [{ $ref: '#/components/schemas/AiProfile' }, { type: 'null' }] }
        version: { type: [integer, 'null'] }
        updatedAt: { type: [string, 'null'] }
      additionalProperties: true
    AiProfileVersion:
      type: object
      required: [version, updatedAt]
      properties:
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string }
        updatedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
      additionalProperties: false
    AiProfileAdmin:
      type: object
      required: [ok, profile, version, updatedAt, updatedBy, versions]
      properties:
        ok: { const: true }
        profile: { oneOf: [{ $ref: '#/components/schemas/AiProfile' }, { type: 'null' }] }
        version: { type: [integer, 'null'] }
        updatedAt: { type: [string, 'null'] }
        updatedBy: { type: [string, 'null'] }
        versions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AiProfileVersion' } }
      additionalProperties: true
    AiProfileSaved:
      type: object
      required: [ok, version]
      properties:
        ok: { const: true }
        version: { type: integer, minimum: 1 }
      additionalProperties: true
    AttachmentType:
      type: string
      enum: [image, pdf, docx, xlsx, csv, markdown, text]
      description: image = PNG, JPEG, WebP, GIF.
    AttachmentFile:
      type: object
      required: [name, mediaType]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: "The file name (no path). Never stored or audited." }
        mediaType: { type: string, maxLength: 200, description: "As the browser reported it; the extension and the leading bytes must agree." }
        size: { type: integer, minimum: 1, maximum: 10485760, description: "Bytes after decoding (required without data; must match data when both are sent)." }
        data: { type: string, contentEncoding: base64, description: "The file (documents: required; images: left out)." }
    AttachmentDocument:
      type: object
      required: [name, kind, text, chars, truncated]
      properties:
        name: { type: string }
        kind: { type: string, enum: [pdf, docx, xlsx, csv, markdown, text] }
        text: { type: string, description: "Markdown. Reference material for the AI, never instructions." }
        chars: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        pages: { type: integer, minimum: 0, description: "PDF: the number of pages." }
        sheets: { type: integer, minimum: 0, description: "xlsx: the number of sheets read." }
        ocr: { type: string, enum: [engine, model], description: "PDF pages without a text layer (scans) were read by OCR: engine = the business system's OCR engine (text only), model = sent as pageImages for a model that reads images." }
        ocrPages: { type: integer, minimum: 1, maximum: 10, description: "How many scanned pages were read by OCR (all documents of one prepare together: at most 10)." }
        pageImages:
          type: array
          maxItems: 10
          description: "ocr = model: the scanned pages as JPEG (the page text says so). The BFF forwards them to the AI runtime as images; a model that cannot read images refuses them (images_not_supported, details.reason scanned_pdf)."
          items:
            type: object
            required: [page, mediaType, data]
            additionalProperties: false
            properties:
              page: { type: integer, minimum: 1 }
              mediaType: { const: image/jpeg }
              data: { type: string, contentEncoding: base64 }
      additionalProperties: true
    AttachmentsPrepared:
      type: object
      required: [ok, documents, images]
      properties:
        ok: { const: true }
        documents: { type: array, items: { $ref: '#/components/schemas/AttachmentDocument' } }
        images:
          type: array
          items:
            type: object
            required: [name, mediaType, size]
            properties:
              name: { type: string }
              mediaType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
              size: { type: integer, minimum: 1 }
      additionalProperties: true
    AttachmentLimits:
      type: object
      required: [maxFiles, maxFileBytes, maxTotalBytes]
      properties:
        maxFiles: { type: integer, minimum: 1, maximum: 5 }
        maxFileBytes: { type: integer, minimum: 1, maximum: 10485760 }
        maxTotalBytes: { type: integer, minimum: 1, maximum: 20971520 }
        maxCharsPerFile: { type: integer, minimum: 1, maximum: 30000 }
        maxCharsTotal: { type: integer, minimum: 1, maximum: 60000 }
      additionalProperties: true
    AttachmentSettings:
      type: object
      required: [ok, enabled, roles, types, limits]
      properties:
        ok: { const: true }
        enabled: { type: boolean }
        roles: { type: array, items: { type: string } }
        types: { type: array, items: { $ref: '#/components/schemas/AttachmentType' } }
        limits: { $ref: '#/components/schemas/AttachmentLimits' }
      additionalProperties: true
    AttachmentAdminSettings:
      type: object
      required: [ok, roles, types, limits]
      properties:
        ok: { const: true }
        roles: { type: array, items: { type: string } }
        types: { type: array, items: { $ref: '#/components/schemas/AttachmentType' } }
        limits: { $ref: '#/components/schemas/AttachmentLimits' }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
      additionalProperties: true
    OkOnly:
      type: object
      required: [ok]
      properties: { ok: { const: true } }
      additionalProperties: true
    ConnectorInputSchema:
      type: object
      description: A flat object schema (string / number / integer / boolean values); also the AI tool's parameters.
      properties:
        type: { const: object }
        properties: { type: object }
        required: { type: array, items: { type: string } }
        additionalProperties: { const: false }
      additionalProperties: true
    ConnectorOperation:
      type: object
      required: [id, name, path]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string, description: 'Starts with /; {name} placeholders are input fields.' }
        input: { $ref: '#/components/schemas/ConnectorInputSchema' }
        responseFields: { type: array, maxItems: 50, items: { type: string }, description: 'Allow-list of response paths (a.b, items[].id); leaves only.' }
        pii: { type: string, enum: [none, personal, financial, sensitive, health] }
        effect: { type: string, enum: [read, write] }
        idempotent: { type: boolean }
        roles: { type: array, items: { type: string }, description: 'Roles whose employees the AI may act for with this operation (none = not given to the AI).' }
        autoRun:
          type: object
          properties: { allowed: { type: boolean }, reason: { type: [string, 'null'], maxLength: 200 } }
          description: An idempotent write the administrator allowed to run without approval (with a reason). Reads always may.
      additionalProperties: true
    Connector:
      type: object
      required: [name, baseUrl]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [own, third_party] }
        description: { type: string, maxLength: 300 }
        baseUrl: { type: string, description: https only (http to localhost in development). }
        allowedHosts: { type: array, maxItems: 10, items: { type: string } }
        auth:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [none, api_key, bearer, basic, oauth2_client] }
            headerName: { type: string }
            username: { type: string }
            tokenUrl: { type: string }
            clientId: { type: string }
            scope: { type: [string, 'null'] }
          additionalProperties: false
        timeoutMs: { type: integer, minimum: 1000, maximum: 10000 }
        ratePerMinute: { type: integer, minimum: 1, maximum: 600 }
        maxResponseBytes: { type: integer, minimum: 1024, maximum: 1048576 }
        enabled: { type: boolean }
        operations: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ConnectorOperation' } }
      additionalProperties: true
    ConnectorAdmin:
      allOf:
        - { $ref: '#/components/schemas/Connector' }
        - type: object
          required: [hasSecret, secretHint]
          properties:
            hasSecret: { type: boolean }
            secretHint: { type: [string, 'null'], description: The last 4 characters of the secret. }
            updatedAt: { type: [string, 'null'], format: date-time }
            updatedBy: { type: [string, 'null'] }
    ConnectorState:
      type: object
      required: [stopped]
      properties:
        stopped: { type: boolean }
        stoppedBy: { type: [string, 'null'] }
        stoppedAt: { type: [string, 'null'], format: date-time }
      additionalProperties: true
    ConnectorAdminList:
      type: object
      required: [ok, connectors, state]
      properties:
        ok: { const: true }
        connectors: { type: array, items: { $ref: '#/components/schemas/ConnectorAdmin' } }
        state: { $ref: '#/components/schemas/ConnectorState' }
        allowLocalhost: { type: boolean }
        events: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
      additionalProperties: true
    ConnectorSecretState:
      type: object
      required: [ok, hasSecret, secretHint]
      properties:
        ok: { const: true }
        hasSecret: { type: boolean }
        secretHint: { type: [string, 'null'] }
      additionalProperties: true
    ConnectorCatalog:
      type: object
      required: [ok, operations]
      properties:
        ok: { const: true }
        operations:
          type: array
          items:
            type: object
            required: [connectorId, operationId, name, effect, roles, input]
            properties:
              connectorId: { type: string }
              connectorName: { type: string }
              operationId: { type: string }
              name: { type: string }
              description: { type: string }
              effect: { type: string, enum: [read, write] }
              pii: { type: string }
              roles: { type: array, items: { type: string } }
              input: { $ref: '#/components/schemas/ConnectorInputSchema' }
            additionalProperties: true
      additionalProperties: true
    ConnectorRunResult:
      type: object
      required: [ok, connectorId, operationId, data]
      properties:
        ok: { const: true }
        connectorId: { type: string }
        operationId: { type: string }
        status: { type: integer }
        data: { type: object, description: The allow-listed response fields only. }
      additionalProperties: true
    ConnectorTestResult:
      type: object
      required: [ok, result]
      properties:
        ok: { const: true }
        result:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            code: { type: [string, 'null'] }
            status: { type: [integer, 'null'] }
            durationMs: { type: integer }
            operationId: { type: string }
            fields: { type: array, items: { type: string } }
          additionalProperties: true
      additionalProperties: true
    ConnectorRule:
      type: object
      required: [name, trigger, action]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        name: { type: string, maxLength: 60 }
        enabled: { type: boolean }
        trigger: { type: object, properties: { event: { type: string }, cron: { type: string, format: cron5 } }, additionalProperties: false }
        when:
          type: [object, 'null']
          properties:
            all: { type: array, items: { $ref: '#/components/schemas/ConnectorCondition' } }
            any: { type: array, items: { $ref: '#/components/schemas/ConnectorCondition' } }
          additionalProperties: false
        action:
          type: object
          required: [connector, operation]
          properties:
            connector: { type: string }
            operation: { type: string }
            input: { type: object }
          additionalProperties: false
        mode: { type: string, enum: [approval, auto, propose-by-ai] }
        approvers: { type: [object, 'null'], properties: { role: { type: string } } }
        notify: { type: object, properties: { onSuccess: { type: string, enum: [none, info, action] }, onFailure: { type: string, enum: [none, info, action] } } }
        allowPii: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
      additionalProperties: true
    ConnectorCondition:
      type: object
      required: [field, op]
      properties:
        field: { type: string, description: 'event.x / payload.x / now.x' }
        op: { type: string, enum: [eq, contains, gt, lt, exists] }
        value: { type: [string, number, boolean] }
      additionalProperties: false
    ConnectorRun:
      type: object
      required: [id, connectorId, operationId, trigger, status]
      properties:
        id: { type: integer }
        ruleId: { type: [string, 'null'] }
        connectorId: { type: string }
        operationId: { type: string }
        trigger: { type: string, enum: [ai, event, cron, approval, test, manual] }
        triggerRef: { type: [string, 'null'] }
        actor: { type: [string, 'null'] }
        status: { type: string, enum: [succeeded, failed, refused, pending_approval, proposed, rejected, skipped] }
        code: { type: [string, 'null'] }
        httpStatus: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        proposalId: { type: [string, 'null'] }
        at: { type: [string, 'null'], format: date-time }
      additionalProperties: true
    DocumentReadsClaimed:
      type: object
      required: [ok, reads]
      properties:
        ok: { const: true }
        reads:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, pages]
            properties:
              id: { type: string, format: uuid }
              purpose: { type: string, description: "What the document is for, e.g. care_inbox (the business system's own word)." }
              language: { type: string, description: "The document's language (BCP 47, e.g. ja)." }
              hint: { type: string, maxLength: 200, description: "A short label of the form (e.g. ケアプラン 第2表). Never a person's name." }
              pages:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  required: [page, mediaType, data]
                  additionalProperties: false
                  properties:
                    page: { type: integer, minimum: 1 }
                    mediaType: { type: string, enum: [image/jpeg, image/png] }
                    data: { type: string, contentEncoding: base64 }
            additionalProperties: true
      additionalProperties: true
    DocumentReadResult:
      oneOf:
        - type: object
          required: [pages]
          additionalProperties: false
          properties:
            pages:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required: [page, text]
                additionalProperties: false
                properties:
                  page: { type: integer, minimum: 1 }
                  text: { type: string, maxLength: 20000 }
        - type: object
          required: [error]
          additionalProperties: false
          properties:
            error: { type: string, enum: [images_not_supported, model_failed, too_large] }
