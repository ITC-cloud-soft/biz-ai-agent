openapi: 3.1.0
info:
  title: DSH Business Bridge protocol
  version: 1.0.0
  summary: What a business system provides so the AI plane (DSH) and SNS can work with it.
  description: |
    Protocol v1 of the DSH Business Bridge (see docs/ARCHITECTURE.md).
    A business system implements these endpoints (hand written, or with @dsh-bridge/server-kit) under `/bridge/v1`,
    then proves it with the conformance suite in `packages/protocol/conformance`.

    ## Security invariants (section 3, enforced by the conformance suite)
    1. Link yourself only: every employee links only their own SNS account; nobody (admin included) links or unlinks another employee.
    2. Delegation = AI allow-list intersected with the employee role: the AI never has more power than the employee it acts for;
       a sender that is not linked gets no business data at all.
    3. The AI reads and proposes; confirming, approving, issuing and paying are always done by a person.
    4. Events and IM messages carry no personal information: event payloads are whitelisted IDs / dates / counts / status values,
       IM text is a parameter template (numbers and times only).
    5. Identity comes only from the business system (tickets / delegation tokens); a `userId` in a request body is never trusted.
    6. The business system is the single source of record; DSH keeps conversations only.

    ## Conventions
    * Every response (errors included) carries the header `bridge-protocol: 1`.
    * JSON only. Success bodies are `{ "ok": true, ... }`. Errors are `{ "ok": false, "error": "<code>", "message"?: "<text for people>" }`
      (see ErrorEnvelope and the `x-error-codes` catalog below). Codes are lower snake case and stable; messages are not.
    * Time values are ISO 8601 with offset. IDs are opaque strings.
    * Validation errors never embed a field name in the code: `required` / `invalid_value` (and the other codes) carry the
      field in `details.field` (for example `{ ok: false, error: required, details: { field: botId } }`).
    * An implementation that maps v1 onto older routes of its own may document the mapping per operation in an optional
      `x-alias` list (`{ method, path, status: exact | shape | missing, note?, for? }`; see `aliasTable` in src/openapi.mjs).
      This document carries none: the mapping of the first user (care-api) lives in examples/care-billing/manifest.
  x-bridge-protocol: 1
  x-error-codes:
    invalid_service_token: { status: 401, meaning: "x-service-token is wrong." }
    q_required: { status: 400, meaning: "The question (q) is missing (help)." }
    invalid_limit: { status: 400, meaning: "limit is not an integer 1-5 (help)." }
    authentication_required: { status: 401, meaning: "No valid user session or service token." }
    service_token_required: { status: 401, meaning: "A delegation token was sent without the service token." }
    invalid_delegation_token: { status: 401, meaning: "The delegation token is unknown, expired, revoked, or its employee / link / web session ended." }
    delegation_not_permitted: { status: 403, meaning: "A delegation token cannot call this operation (read and propose only)." }
    insufficient_role: { status: 403, meaning: "The caller's role may not do this." }
    role_not_permitted: { status: 403, meaning: "The employee's role may not do this for this kind of object." }
    human_required: { status: 403, meaning: "Only a logged-in employee (not the service principal) may call this." }
    bff_only: { status: 403, meaning: "Needs the employee session AND the BFF secret; a browser alone cannot do this." }
    bff_secret_not_configured: { status: 503, meaning: "The BFF secret is not configured on the server." }
    identity_not_linked: { status: 404, meaning: "The SNS account is not linked to an employee." }
    identity_not_found: { status: 404, meaning: "No such link among the caller's own links." }
    identity_already_linked: { status: 409, meaning: "The SNS account is already linked (to this or another employee)." }
    link_code_invalid: { status: 404, meaning: "Unknown, used or revoked link code." }
    link_code_expired: { status: 410, meaning: "The link code expired." }
    too_many_attempts: { status: 429, meaning: "Too many failed attempts from this source." }
    too_many_requests: { status: 429, meaning: "Rate limit." }
    personal_bot_owner_mismatch: { status: 403, meaning: "The link code belongs to someone other than the registrant of the personal bot it was sent through." }
    personal_bot_revoked: { status: 403, meaning: "The personal bot was retired; nobody can link through it." }
    bot_already_registered: { status: 409, meaning: "The bot is registered as another employee's personal bot." }
    invalid_platform: { status: 400, meaning: "Platform not allowed here." }
    invalid_assistant_ticket: { status: 401, meaning: "Unknown, expired or revoked ticket, or its web session ended." }
    session_revoked: { status: 401, meaning: "The web session ended." }
    event_not_found: { status: 404, meaning: "Unknown event id." }
    event_not_delegable: { status: 422, meaning: "Per-event delegation: this event type grants no delegation." }
    event_stale: { status: 409, meaning: "Per-event delegation: the event is no longer fresh." }
    event_delegation_refused: { status: 403, meaning: "Per-event delegation: the person the event names is not eligible now (who it would be is not told)." }
    approval_not_found: { status: 404, meaning: "Unknown approval." }
    delivery_not_found: { status: 404, meaning: "Unknown delivery or token." }
    proposal_not_found: { status: 404, meaning: "Unknown proposal." }
    identity_mismatch: { status: 403, meaning: "The approval card was not addressed to the employee behind the SNS account." }
    invalid_reply_code: { status: 403, meaning: "Wrong reply code." }
    delivery_locked: { status: 429, meaning: "Too many wrong reply codes; decide in the web UI." }
    delivery_used: { status: 409, meaning: "The card token was already used." }
    delivery_revoked: { status: 409, meaning: "The card token was revoked." }
    expired: { status: 410, meaning: "The approval expired." }
    already_decided: { status: 409, meaning: "Generic form is already_<status> (already_approved, already_rejected, ...)." }
    token_or_reply_code_required: { status: 400, meaning: "Exactly one of token / replyCode is needed." }
    required: { status: 400, meaning: "A required field is missing or empty (details.field names it)." }
    invalid_value: { status: 400, meaning: "A field is malformed or out of range (details.field names it)." }
    unknown_fields: { status: 400, meaning: "The body has fields the operation does not accept (fields lists them)." }
    invalid_profile: { status: 422, meaning: "The AI employee's profile failed the check (details.errors: [{ field, code, kinds? }], never the matched text)." }
    version_not_found: { status: 404, meaning: "No such version of the AI employee's profile." }
    attachments_not_allowed: { status: 403, meaning: "Attachments: the employee's role may not attach files (attachment settings)." }
    too_many_files: { status: 422, meaning: "Attachments: more than 5 files (or the system's lower limit)." }
    file_too_large: { status: 422, meaning: "Attachments: one file is larger than 10 MB (details.index / name)." }
    total_too_large: { status: 422, meaning: "Attachments: the files together are larger than 20 MB." }
    unsupported_type: { status: 422, meaning: "Attachments: a type that is not accepted or not allowed (macro-enabled, xls / doc, archives, executables; details.reason disabled = turned off in the settings)." }
    type_mismatch: { status: 422, meaning: "Attachments: the extension, the media type and the leading bytes disagree." }
    no_text: { status: 422, meaning: "Attachments: no text could be read from the document (details.reason ocr_unavailable: scanned pages could not be rendered for OCR; ocr_off: OCR is off)." }
    images_not_supported: { status: 422, meaning: "Attachments: the AI employee's model cannot read images." }
    invalid_attachment: { status: 422, meaning: "Attachments: malformed entry (details.reason: name, data, size, empty, shape, unknown_field, pdf_unreadable, ...)." }
    invalid_connector: { status: 422, meaning: "External connectors: the connector failed the check (details.errors: [{ field, code }])." }
    invalid_rule: { status: 422, meaning: "External connectors: the rule failed the check (details.errors: [{ field, code }])." }
    invalid_secret: { status: 422, meaning: "External connectors: the secret does not fit the auth type (details.errors: [{ field, code }], never the value)." }
    connector_not_found: { status: 404, meaning: "External connectors: no such connector." }
    operation_not_found: { status: 404, meaning: "External connectors: no such operation (or not given to the AI)." }
    rule_not_found: { status: 404, meaning: "External connectors: no such rule." }
    connector_in_use: { status: 409, meaning: "External connectors: a rule uses it (details.rules)." }
    connector_stopped: { status: 409, meaning: "External connectors: the connector is disabled or the emergency stop is on." }
    write_requires_approval: { status: 403, meaning: "External connectors: a write operation never runs from the AI; propose it (kind connector_write)." }
    connector_failed: { status: 502, meaning: "External connectors: the external API call failed (details.code: timeout / network_error / upstream_error / ...; details.status)." }
    read_not_found: { status: 404, meaning: "Document reads: no such read." }
    read_not_claimed: { status: 409, meaning: "Document reads: the read is not claimed (never handed out, already answered, or handed out again after its claim expired)." }
    manifest_unavailable: { status: 503, meaning: "The manifest could not be loaded." }
    invalid_json: { status: 400, meaning: "Body is not a JSON object." }
    invalid_encoding: { status: 400, meaning: "Body is not valid UTF-8." }
    payload_too_large: { status: 413, meaning: "Body too large." }
    not_found: { status: 404, meaning: "Unknown path." }
    method_not_allowed: { status: 405, meaning: "Wrong HTTP method for the path." }
    internal_error: { status: 500, meaning: "Unexpected failure (never contains details)." }
servers:
  - url: /bridge/v1
    description: Mounted by the business system under /bridge/v1.
tags:
  - { name: identity, description: "Identity lookup and linking (DSH to business, service token)." }
  - { name: me, description: "Operations of the logged-in employee on their own data (BFF / web session)." }
  - { name: delegation, description: "Short-lived tokens that let the AI act as one employee." }
  - { name: events, description: "Business events (transactional outbox, cursor)." }
  - { name: notifications, description: "Deterministic IM notifications: recipients, templates, delivery results." }
  - { name: approvals, description: "IM approval cards and decisions." }
  - { name: assistant, description: "Web AI assistant: ticket bound to the web session, exchanged for a delegation; files attached in the panel (optional)." }
  - { name: reports, description: "Scheduled business reports." }
  - { name: proposals, description: "AI proposals (generic envelope; content defined by the business)." }
  - { name: manifest, description: "The business manifest." }
  - { name: profile, description: "The AI employee's profile (optional): nickname, tone, company introduction, personality, background." }
  - { name: meta, description: "Health." }
  - { name: help, description: "How-to questions answered from the business system's manual (optional)." }
  - { name: connectors, description: "External connectors of the AI employee (optional): own and third-party APIs, run by the business system." }
  - { name: document-reads, description: "Scanned documents read by the AI model (optional): page images the business system hands out, text back." }
security: []
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness and protocol version
      description: Unauthenticated. `protocol` must be 1.
      x-invariants: []
      security: []
      responses:
        '200':
          description: Alive.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /manifest:
    get:
      tags: [manifest]
      operationId: getManifest
      summary: The business manifest
      description: |
        Machine-readable self introduction (schema/manifest.schema.json). DSH reads it at start-up and periodically; `etag`
        changes when the content changes and `If-None-Match` is honoured (304).
      x-invariants: []
      security: [{ serviceToken: [] }]
      parameters:
        - { name: if-none-match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: The manifest.
          headers:
            bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' }
            etag: { schema: { type: string }, description: Strong or weak entity tag of the manifest content. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '304': { description: Unchanged since the given etag., headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /identity:
    get:
      tags: [identity]
      operationId: lookupIdentity
      summary: Who is this SNS account?
      description: |
        Resolves a trusted IM source to an ACTIVE employee. An account that is not linked answers `linked: false` and
        nothing else: no hint about which employees exist (invariant 2).
      x-invariants: [2]
      security: [{ serviceToken: [] }]
      parameters:
        - { name: platform, in: query, required: true, schema: { $ref: '#/components/schemas/Platform' } }
        - { name: teamId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: userId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: botId, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Lookup result.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityLookup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /identities/link:
    post:
      tags: [identity]
      operationId: linkIdentity
      summary: Link an SNS account with a link code
      description: |
        The employee issued a code in the web UI (POST /me/link-codes) and sent "link 123456" to the bot. DSH calls this with
        the trusted source of that message. The code links the account to the employee who ISSUED it, nobody else; it is
        single use and short lived; failed attempts per source (and globally) are throttled (429). A code sent through
        someone else's personal bot is refused (personal_bot_owner_mismatch) and burnt.
      x-invariants: [1, 5]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkRequest' }
            example: { code: '123456', source: { platform: slack, teamId: T0001, userId: U0001 } }
      responses:
        '200':
          description: Linked.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /identities/stats:
    get:
      tags: [identity]
      operationId: identityStats
      summary: Counts of linked accounts
      description: Counts only (no personal data).
      x-invariants: [4]
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Counts.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/link-codes:
    post:
      tags: [me]
      operationId: createLinkCode
      summary: Issue a link code for MYSELF
      description: |
        Only a logged-in employee, only for themselves. The body is ignored: a `userId` there never changes whose code it is.
        The service principal and delegation tokens are refused. A new code revokes the previous unused one. Issuing is rate limited.
      x-invariants: [1, 5]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The code (shown once; only a hash is stored).
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/identities:
    get:
      tags: [me]
      operationId: listMyIdentities
      summary: My own SNS links
      description: Own links only, for every role (admin included). There is no operation that binds an account on behalf of someone.
      x-invariants: [1]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      responses:
        '200':
          description: My links.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyIdentities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/identities/{identityId}:
    delete:
      tags: [me]
      operationId: deleteMyIdentity
      summary: Unlink one of MY links
      description: |
        Someone else's link answers 404 (existence is not disclosed), admin included. Unlinking ends, in the same
        transaction, the delegation tokens and pending IM approval cards of that account, retires a personal bot
        linked through it, and emits the event `sns_identity.unlinked` so IM-side caches drop the account.
      x-invariants: [1, 2]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdentityId' }
      responses:
        '200':
          description: Unlinked.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/identities/{identityId}/bot:
    get:
      tags: [me]
      operationId: getMyIdentityBot
      summary: The bot of one of MY links
      description: Used by the BFF to check ownership before it deletes a personal bot.
      x-invariants: [1]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdentityId' }
      responses:
        '200':
          description: The bot.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityBot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/personal-bots:
    get:
      tags: [me]
      operationId: listMyPersonalBots
      summary: My personal bots
      description: Own active personal bots only (admin included).
      x-invariants: [1]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      responses:
        '200':
          description: My bots.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalBots' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [me]
      operationId: registerMyPersonalBot
      summary: Register a personal bot as MINE (BFF only)
      description: |
        Personal IM bots (for example a WeChat bot the employee connected by QR code) belong to exactly one employee.
        Registration needs the employee session AND the BFF secret (constant-time compare); a browser calling the
        business API directly gets 403 bff_only (audited). Idempotent for the registrant (200, created: false); a bot
        registered by someone else is 409. A link code sent through a registered personal bot is accepted only from its
        registrant (see linkIdentity).
      x-invariants: [1, 5]
      security: [{ userSessionCookie: [], bffSecret: [] }, { userBearer: [], bffSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPersonalBot' }
      responses:
        '200':
          description: Already registered by me.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredPersonalBot' }
        '201':
          description: Registered.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredPersonalBot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/notification-preferences:
    get:
      tags: [me]
      operationId: getMyNotificationPreferences
      summary: My notification preferences
      description: Own preferences only; defaults when never saved. No operation reads or writes someone else's.
      x-invariants: [1]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      responses:
        '200':
          description: Preferences and the list of notifiable event types.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [me]
      operationId: updateMyNotificationPreferences
      summary: Update my notification preferences (partial)
      x-invariants: [1]
      security: [{ userSessionCookie: [] }, { userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' }
      responses:
        '200':
          description: Saved.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesSaved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /delegations:
    post:
      tags: [delegation]
      operationId: issueDelegation
      summary: A delegation token for the employee behind an SNS account
      description: |
        The AI then calls business endpoints with BOTH `x-service-token` and `x-delegation-token`; the business system acts
        as `AI allow-list intersected with the employee's role` (read and propose only, never confirm / approve / pay).
        Not linked: 404 identity_not_linked and NO token (invariant 2). The token lives at most 5 minutes, is stored only
        as a hash and is bound to the link: unlinking or deactivating the employee ends it at once. Only the service
        principal may call this (a delegation token cannot mint another).

        Optional per-event form `{ event: { id } }` (an automatic task whose playbook delegation is `<class>=each`): the
        business system issues a delegation for the person its own event names (never a person the caller chooses), only
        for event types it declares delegable, only while that event is fresh and the person's own opt-in holds, and the
        token stays bound to those conditions (it stops working when they end). Unknown event: 404; a type that grants no
        delegation: 422; a stale event: 409; a person who is not eligible: 403. A business system without the per-event
        form answers 400 to the `event` key.
      x-invariants: [2, 5]
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationRequest' }
      responses:
        '201':
          description: The token (shown once).
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Business events after a cursor
      description: |
        Events are inserted in the same transaction as the business change, so ids are committed in increasing order and a
        cursor never skips an event. Read-only and repeatable; the consumer stores `nextAfter`. Payload keys are
        whitelisted per event type by the manifest and carry only IDs, dates, counts and status values (invariant 4).
        Reads that disclose events are audited.
      x-invariants: [4]
      security: [{ serviceToken: [] }]
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: A page.
          headers: { bridge-protocol: { $ref: '#/components/headers/BridgeProtocol' } }
          content:
