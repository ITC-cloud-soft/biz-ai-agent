    intent: action
    action: 業務 Web の「件数・集中減算」で内訳を確かめ、正当な理由の有無と判定書の準備をご検討ください。
    description: 主任ケアマネと管理者あての AI 秘書の【対応のお願い】（E2）。判定期間（month = YYYY-03 / YYYY-09）と、80% を超えたサービスの種類（type11 訪問介護・type15 通所介護・type78 地域密着型通所介護・type17 福祉用具貸与の flag）だけ。事業所名・割合は載せない。
    params:
      count: { type: integer }
      month: { type: month, optional: true }
      type11: { type: flag, optional: true }
      type15: { type: flag, optional: true }
      type78: { type: flag, optional: true }
      type17: { type: flag, optional: true }
