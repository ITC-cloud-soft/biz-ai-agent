audienceRules:
  managers:
    description: 介護担当（管理者は含まない。管理者は定時報告で件数を見る、ROLE_MODEL §5.1）。事件の利用者（記録・訪問・帳票などの対象）が登録された事業所（訪問介護・住まい）の介護担当だけ（N1a、NOTIFY_RECIPIENTS §1。利用者が分からないときは訪問介護の事業所。所属の無い職員・登録の無い利用者は唯一の訪問介護の事業所に数える、C1）。区分変更の兆候は、事業所内の担当ケアマネがいればその人（代行中は代行者）に【ご相談】で、いなければ介護担当に（事件の audience.include の resident_care_manager）。
    roles: [manager]
    implementedBy: notifications.mjs MANAGERS
  managers_except_author:
    description: 承認できる介護担当（利用者の事業所の人だけ）。記録の作成者本人は除く（受信者が見られる利用者の未承認件数を、本人の記録を除いて数えて渡す）。本人を除いた有効な介護担当が 0 人のときだけ管理者へ回付（事件の audience.fallback）。
    roles: [manager]
    excludes: [author]
  author_of_record:
    description: 記録を差し戻された本人。
    includes: [author]
  assignee_and_managers:
    description: 訪問の担当職員と介護担当（manager ロールのみ。admin は含まない）。
    roles: [manager]
    includes: [assignee]
  managers_except_submitter:
    description: 計画書の承認者（旧い流れの行だけ）。介護担当で、提出者本人は除く（分かる場合）。0 人なら管理者へ回付（事件の audience.fallback）。
    roles: [manager]
    excludes: [author]
  approvers_except_applicant:
    description: 希望休の承認者。申請者本人は除く。ケアマネの申請は主任ケアマネ（事件の audience.include の lead_care_managers）、それ以外は介護担当。0 人なら管理者へ回付（事件の audience.fallback）。
    roles: [manager]
    excludes: [applicant]
  applicant:
    description: 申請者本人（希望休の結果）。
    includes: [applicant]
  shift_employees:
    description: 公開されたシフト（または月）に割当のある職員だけ。割当が読めないときは誰にも送らない（no_scope。法人全体には送らない、N1a）。
    includes: [assignee]
  assignment_employee:
    description: 変更されたシフト割当の職員。
    includes: [assignee]
  payroll_operator:
    description: 給与計算の担当（請求・給与担当。勤怠の月締め → 給与計算の依頼）。請求・給与担当がいなければ管理者へ回付（事件の audience.fallback）。
    roles: [billing]
  employee_self:
    description: 本人（給与明細）。
    includes: [employee]
  safety_pending_responders:
    description: 安否確認にまだ回答していない対象者。
    includes: [responder]
  safety_managers:
    description: 要支援・不在・連絡不可・期限超過の通知先（管理者・介護担当と確認の作成者。至急として管理者にも残す）。介護担当は対象（利用者の登録・職員の所属）の事業所の人だけで、期限超過の件数はその人の対象の分（N1a）。
    roles: [admin, manager]
    includes: [creator]
  thread_audience_except_sender:
    description: スレッドの参加者から送信者を除く。本文は送らない（リンクだけ）。
    includes: [participant]
    excludes: [sender]
  document_assignee_or_managers:
    description: 帳票の担当者。担当者がいないときは介護担当。
    roles: [manager]
    includes: [assignee]
  managers_except_completer:
    description: 介護担当から完了した本人を除く（既定はオフ）。
    roles: [manager]
    excludes: [completer]
  swap_target_staff:
    description: 振替を依頼された職員（依頼が有効な間）。
    includes: [assignee]
  swap_offerer_or_managers:
    description: 振替を依頼した人。分からないときは介護担当。承諾・相談・辞退の結果。
    roles: [manager]
    includes: [offerer]
  managers_except_reporter:
    description: 介護担当から報告者本人を除く。影響度 3b 以上（至急）のときだけ管理者と、利用者の担当ケアマネ（事業所内。代行中は代行者）にも。
    roles: [manager]
    includes: [admin_if_severe, resident_care_manager_if_severe]
    excludes: [reporter]
  managers_except_requester:
    description: 訂正申請の判断者。介護担当で、申請者本人は除く（申請が保留の間）。0 人なら管理者へ回付（事件の audience.fallback）。
    roles: [manager]
    excludes: [requester]
  correction_requester:
    description: 訂正を申請した本人（承認・却下の結果）。
    includes: [requester]
  billing:
    description: 請求・給与担当（管理者は含まない。管理者は定時報告で件数を見る、ROLE_MODEL §5.1）。督促状は発行した本人を除く。
    roles: [billing]
    implementedBy: notifications.mjs BILLING
  billing_except_actor:
    description: 請求・給与担当から、その操作（区分変更の申請・認定・取下げ）をした本人を除く。
    roles: [billing]
    excludes: [actor]
  managers_except_actor:
    description: 介護担当から、その操作（区分変更の反映・決定、ケアプラン資料の登録）をした本人を除く。区分変更の反映・決定は利用者の担当ケアマネ（事件の audience.include の resident_care_manager）にも。
    roles: [manager]
    excludes: [actor]
  managers_except_deliverer:
    description: 介護担当（事業所内のケアマネが交付したケアプランの受け手、ROLE_MODEL §5.4）。交付したケアマネ本人は除く。
    roles: [manager]
    excludes: [deliverer]
  approval_requester_except_decider:
    description: 承認の依頼者だけ（管理者には送らない、ROLE_MODEL §5.2）。決定（承認・却下・取消）した本人は除く。状態は executed / approved / rejected / cancelled の件数で渡す。給与（payroll_run）は approval.decided.payroll。
    includes: [requester]
    excludes: [decider]
  approval_requester:
    description: 承認の依頼者だけ（期限切れ。給与は approval.expired.payroll）。
    includes: [requester]
  plan_author:
    description: 承認された訪問介護計画書の作成者（提出者）。承認者本人は除く（介護担当が自分で確定した計画書は、確定者＝作成者なので誰にも送らない）。
    includes: [author]
    excludes: [approver]
  resident_care_manager:
    description: 利用者の担当ケアマネ（事業所内の職員に結び付いたケアマネ。代行中は代行者だけ）。事業所外のケアマネ・担当なしは誰にも送らない。
    includes: [resident_care_manager]
    implementedBy: services/care-api/src/repo/cm-scope.mjs (residentCareManagerRecipients)
  lead_care_managers:
    description: 有効な主任ケアマネのうち、そのケアマネ・利用者と同じ居宅介護支援の事業所の人だけ（ケアマネの希望休の承認者・ケアマネの分のエスカレーションの相手。法人全体の主任ではない、N1a）。担当本人・申請者本人は除く。0 人なら管理者へ回付（事件の audience.fallback）。
    roles: [care_manager]
    includes: [lead_care_managers]
    implementedBy: services/care-api/src/repo/cm-scope.mjs (leadCareManagerUserIds)
  monitoring_delegate:
    description: モニタリングの下書きを任せたケアマネ本人（事件の careManagerId / userId。利用者の担当ケアマネ、代行中は代行者。個人設定「AI にモニタリングの下書きを任せる」がオンの人だけ、ROLE_MODEL §8.3 の委任の分類 care_manager=each）。下書きそのものは ai_proposal.created.monitoring でその人に届く。
    roles: [care_manager]
    includes: [draft_delegate]
    implementedBy: services/care-api/src/repo/cm-monitoring.mjs (monitoringDraftTargets)
  deadline_care_manager:
    description: 期限の通知の受信者（care-worker の期限のジョブが事件の userId に入れた職員）。利用者の担当ケアマネ（事業所内の職員に結び付いたケアマネ）、代行中は代行者だけ。事業所外のケアマネ・担当なしの利用者は数えない（片付かないときの主任へのエスカレーションは escalation.raised、U7）。1 回の実行でケアマネ 1 人・種別 1 つに 1 件。
    roles: [care_manager]
    includes: [deadline_recipient]
    implementedBy: services/care-api/src/repo/cm-deadlines.mjs (deadlineRecipients)
  escalation_recipients:
    description: AI エスカレーションの相手（ROLE_MODEL §6.3、care-worker のジョブが事件の notifyRole に入れた役割）。介護担当・請求・給与担当の分は管理者、ヘルパーの分（差戻し・振替の依頼）は介護担当、ケアマネの分は主任ケアマネ（事件の audience.include の lead_care_managers）。0 人・設定で主任に送らないときは管理者へ回付（事件の audience.fallback、escalation.raised.lead.fallback）。担当者本人には送らない。主任・介護担当は担当者の事業所の人だけで、件数はその事業所の分（だれもいない事業所の分は管理者へ回付、N1a）。
    roles: [admin, manager]
    excludes: [escalation_owner]
    implementedBy: services/care-api/src/repo/escalations.mjs (notifyTargetOf) / notifications.mjs (escalationRule)
  proposal_reviewers:
    description: AI 提案のレビュー担当（種別ごと）。請求の下書き・取込・突合・督促の提案は請求・給与担当、記録の整理・計画書の言い換えは介護担当（記録・計画書の作成者本人を除く）、モニタリングの下書きは委任した担当ケアマネ、それ以外は介護担当。レビュー中（pending_review）の間だけ。
    roles: [manager, billing]
    includes: [delegating_care_manager]
    excludes: [author, delegator]
    implementedBy: services/care-api/src/repo/ai.mjs (PROPOSAL_REVIEWERS) / notifications.mjs
  assignment_parties:
    description: 担当替え（ROLE_MODEL §11.2）の新旧の担当ケアマネ（事業所内の有効な職員。新しい担当は added、前の担当は removed）と介護担当（.manager の文面）。担当替えをした主任・管理者本人は除く。
    roles: [manager]
    includes: [to_care_manager, from_care_manager]
    excludes: [actor]
  cover_parties:
    description: 代行（ROLE_MODEL §11.3）の代行者と不在の本人（事業所内の有効な職員。covering / absent）。付与した主任・管理者本人は除く。取消された・期間の終わった付与には送らない。
    includes: [cover_care_manager, absent_care_manager]
    excludes: [granter]
  lead_reviewers:
    description: ケアプランの確認の依頼（R4）を受ける有効な主任ケアマネ（利用者の担当ケアマネと同じ居宅介護支援の事業所の人だけ、N1a）。依頼した本人と、その利用者の担当・代行の主任は除く（自分の担当は確認しない）。管理者への回付はしない（管理者はケアプランを確認しない）。
    includes: [lead_care_managers]
    excludes: [requester, resident_care_manager]
  report_recipients:
    description: 設定された受信者（役割 admin / manager / billing / care_manager と、その役割の個別の職員）。項目は受信者の役割ごと（ケアマネは自分の担当分、主任はチームの件数も）。介護担当は自分の事業所（訪問介護・住まい）の件数だけ、主任のチームは同じ居宅介護支援の事業所のケアマネだけ（G1）。法人全体の件数は管理者だけ。テスト報告は依頼者だけ。
    roles: [admin, manager, billing, care_manager]
    includes: [configured_user]
  approvers_of_approval:
    description: 承認を判断する有効な管理者で、申請者本人を除く（承認は管理者だけが判断する、ROLE_MODEL §4.1。1 名で確定、二段承認は 2026-10-26 に廃止）。管理者が依頼者 1 人だけのときは直接確定（Q1）。
    roles: [admin]
    excludes: [requester]
  office_managers:
    description: 利用者を見られる有効な介護担当（その利用者が登録された事業所＝訪問介護・住まいの職員。登録の無い利用者・事業所の無い職員は唯一の訪問介護の事業所に数える、C1）。0 人なら管理者へ回付（事件の audience.fallback）。
    roles: [manager]
    includes: [resident_office_managers]
    implementedBy: services/care-api/src/repo/cm-notices.mjs (residentOfficeManagerUserIds)
  caseload_parties:
    description: G6：居宅介護支援の事業所の判定（事業所の件数 ÷ 常勤換算＝取扱件数、G5）が逓減の区分に入った事業所の有効な主任ケアマネ（.lead の文面）とケアマネ（その事業所に所属する人だけ、N1a）。E2 の形の事件（ケアマネ 1 人の件数、事件の userId）は本人と同じ事業所の主任。
    roles: [care_manager]
    includes: [care_manager_of_event, office_lead_care_managers]
    implementedBy: services/care-api/src/repo/cm-notices.mjs (officeLeadUserIds)
  concentration_recipients:
    description: 特定事業所集中減算の割合が 80% を超えた居宅介護支援の事業所の有効な主任ケアマネと、管理者。
    roles: [admin, care_manager]
    includes: [office_lead_care_managers]
    implementedBy: services/care-api/src/repo/cm-notices.mjs (officeLeadUserIds)
  approval_reminder_admins:
    description: 承認の念押し（期限の 24 時間前に 1 回）。判断できる有効な管理者で、依頼者本人は除く（有効な管理者が依頼者 1 人だけなら本人＝直接確定ができる人）。
    roles: [admin]
    excludes: [requester]
  public_master_admins_except_author:
    description: P2a：公的マスタの改定案（検証を通った・誤りあり・解析できなかった取込み）。テナントの有効な管理者（法人全体、TENANT_SUBJECT）から、取り込んだ・入力した本人を除く。
    roles: [admin]
    excludes: [author]
    implementedBy: services/care-api/src/repo/notifications.mjs (publicMasterRule)
  public_master_admins:
    description: P2a：承認した公的マスタの版が 7 日以内に有効になる（care-worker、テナントごと・版ごとに 1 回）。テナントの有効な管理者（法人全体、TENANT_SUBJECT）。
    roles: [admin]
    implementedBy: services/care-api/src/repo/notifications.mjs (publicMasterRule)
  public_master_detected_admins:
    description: P3a：公的マスタの収集役が新しい版・頁の変化・新しい号を見つけた（1 回の確認で 1 件、すべてのテナント）。テナントの有効な管理者（法人全体、TENANT_SUBJECT）。
    roles: [admin]
    implementedBy: services/care-api/src/repo/notifications.mjs (publicMasterDetectedRule)

events:
  approval.requested:
    label: 承認依頼
    aggregate: approval
    description: 請求の確定（invoice）は金額・請求月、給与の発行（payroll_run）は対象月・人数・明細数だけ（金額は載せない）。
    payload: [approvalId, subjectType, subjectId, action, requiredRole, round, requiredApprovals, total, billingMonth, servicePeriod, month, employeeCount, payslipCount, expiresAt]
    severity: info
    audience: { rule: approvers_of_approval }
    internal: approvals_im
  approval.partially_approved:
    label: （廃止）二段承認の一段目
    description: 非推奨。二段承認の廃止（2026-10-26）以降は発生しない。廃止前の履歴イベントを有効なまま残すためだけに宣言する（通知・テンプレート・宛先なし）。
    aggregate: approval
    payload: [approvalId, subjectType, subjectId, action, status, channel, decidedByUserId, approvalsCount, requiredApprovals]
    severity: info
    internal: approvals_im
    deprecated: true
  approval.decided:
    label: 承認の決定
    description: 承認カードの更新は care-approvals-im、結果の報告（依頼者へ・決定者本人を除く）は care-notify。給与の発行（payroll_run）は対象月と、承認のときは人数・発行した明細数。
    aggregate: approval
    payload: [approvalId, subjectType, subjectId, action, decision, status, channel, decidedByUserId, approvalsCount, requiredApprovals, month, employeeCount, payslipCount]
    severity: info
    audience: { rule: approval_requester_except_decider }
    notify: { template: approval.decided, variants: [approval.decided.payroll], digestMinutes: 2 }
  approval.expired:
    label: 承認の期限切れ
    description: 承認カードの更新は care-approvals-im、期限切れの報告（依頼者へ）は care-notify。
    aggregate: approval
    payload: [approvalId, subjectType, subjectId, action, status]
    severity: warning
    audience: { rule: approval_requester }
    notify: { template: approval.expired, variants: [approval.expired.payroll], digestMinutes: 2 }
  approval.reminded:
    label: 承認の念押し
    description: 期限の 24 時間前に 1 回だけ（care-worker）、判断できる管理者に【承認のお願い】の文字の通知。ボタンは最初の承認カードのまま。
    aggregate: approval
    payload: [approvalId, subjectType, subjectId, action, expiresAt]
    severity: warning
    audience: { rule: approval_reminder_admins }
    notify: { template: approval.reminded, variants: [approval.reminded.payroll] }
  invoice.issued:
    label: 請求の確定
    aggregate: invoice
    payload: [invoiceId, approvalId, billingMonth, servicePeriod, total]
    severity: info
    audience: { rule: billing }
    notify: { template: invoice.issued, digestMinutes: 2 }
  import.completed:
    label: 取込の完了
    aggregate: import_batch
    payload: [batchId, kind, period, rowCount, connectorId, stage]
    severity: info
    audience: { rule: billing }
    notify: { template: import.completed, digestMinutes: 2 }
  ai_proposal.reviewed:
    label: AI 提案の採否
    aggregate: ai_proposal
    payload: [proposalId, kind, status, resultRef, reviewedByUserId]
    severity: info
  ai_proposal.created:
    label: AI 提案の作成
    description: AI（または職員の委任）が提案を作った。レビューは業務 Web の /ai/proposals で行う（IM に採否のボタンは無い）。
    aggregate: ai_proposal
    payload: [proposalId, kind, confidence, targetMonth]
    severity: info
    audience: { rule: proposal_reviewers }
    notify: { template: ai_proposal.created, variants: [ai_proposal.created.monitoring], digestMinutes: 2 }
  receipt.issued:
    label: 領収書の発行
    aggregate: receipt
    payload: [receiptId, invoiceId, amount, billingMonth, auto]
    severity: info
    audience: { rule: billing }
    notify: { template: receipt.issued, digestMinutes: 2 }
  reconciliation.completed:
    label: 回数突合の完了
    aggregate: reconciliation
    payload: [period, rowCount, unresolved, summary]
    severity: info
    audience: { rule: billing }
    notify: { template: reconciliation.completed, digestMinutes: 2 }
  sns_identity.unlinked:
    label: SNS 連携の解除
    aggregate: sns_identity
    payload: [identityId, userId, platform]
    severity: info
    internal: identity
  visit_record.submitted:
    label: 訪問記録の提出
    aggregate: visit_record
    payload: [recordId, scheduleId, residentId, staffUserId, serviceCode, version]
    severity: info
    audience: { rule: managers_except_author, fallback: { roles: [admin], templates: [visit_record.submitted.fallback] } }
    notify: { template: visit_record.submitted, variants: [visit_record.submitted.fallback], digestMinutes: 2 }
  visit_record.returned:
    label: 訪問記録の差戻し
    aggregate: visit_record
    payload: [recordId, scheduleId, residentId, staffUserId, serviceCode, version]
    severity: info
    audience: { rule: author_of_record }
    notify: { template: visit_record.returned, digestMinutes: 0 }
  visit.missed_check_in:
    label: 未打刻
    aggregate: visit_schedule
    payload: [scheduleId, residentId, staffUserId, serviceCode, plannedStart, minutesLate]
    severity: warning
    audience: { rule: assignee_and_managers }
    notify: { template: visit.missed_check_in.manager, variants: [visit.missed_check_in.assignee], digestMinutes: 0 }
  care_plan.imported:
    label: ケアプラン資料の登録
    aggregate: care_plan_doc
    payload: [carePlanId, residentId, kind, careManagerId]
    severity: info
    audience: { rule: managers_except_actor }
    notify: { template: care_plan.imported, digestMinutes: 2 }
    playbook: care_visit_plan_draft
  care_plan.delivered:
    label: ケアプランの交付（事業所内のケアマネ）
    description: 事業所内のケアマネが第 1〜5 表の版を交付した（自事業所の訪問介護が第 2 表にあるときだけ、ROLE_MODEL §11.4）。carePlanId は交付で作った第 2 表の資料、changedTables は前の版から変わった表の番号、tableCount は作った資料の数。受信ボックス・文字読取は通らない。
    aggregate: care_plan_set
    payload: [carePlanSetId, residentId, version, planKind, careManagerId, carePlanId, changedTables, tableCount]
    severity: info
    audience: { rule: managers_except_deliverer }
    notify: { template: care_plan.delivered, digestMinutes: 2 }
    playbook: care_visit_plan_draft
  provision.delivered:
    label: 提供票の交付（事業所内のケアマネ）
    description: 事業所内のケアマネが月の提供票（第 6・7 表）の版を交付した（自事業所の行があるときだけ、ROLE_MODEL §11.5）。carePlanId は交付で作った第 6 表の資料（予定の生成 source service_provision がそのまま読む）、month は対象月（YYYY-MM）、rowCount は自事業所の行の数。介護担当がプレビューを確かめて訪問予定を作る（自動では作らない、R8）。
    aggregate: care_provision_plan
    payload: [provisionPlanId, residentId, month, version, careManagerId, carePlanId, rowCount]
    severity: info
    audience: { rule: managers_except_deliverer }
    notify: { template: provision.delivered, digestMinutes: 2 }
  provision.actual_completed:
    label: 実績の確定（提供票）
    description: 介護担当が訪問介護側の月の提供票（帳票 service_provision）を確定し、担当ケアマネが事業所内なのでシステム内で届けた（care_doc_send の method internal、ROLE_MODEL §11.5）。diffCount は交付済みの提供票（無ければ提供票自身の予定）との差異の件数、provisionPlanId は比べた版。事業所外のケアマネは従来どおり実績ファイル（UPJSK）。
    aggregate: care_document
    payload: [documentId, residentId, month, version, careManagerId, provisionPlanId, diffCount]
    severity: info
    audience: { rule: resident_care_manager }
    notify: { template: provision.actual_completed, digestMinutes: 2 }
  monitoring.draft_requested:
    label: モニタリングの下書きの依頼（ケアマネごと）
    description: 担当ケアマネ 1 人分のモニタリングの AI 下書きの依頼（ROLE_MODEL §11.6・§8.3）。毎月 20 日 07:00 に care-worker が（source schedule、ケアマネごと・月ごとに 1 回）、または本人が業務 Web から（source manual、POST /api/cm/monitoring/draft-requests）出す。careManagerId と userId は委任する職員（代行中の利用者は代行者の分に入る）、month は対象月（YYYY-MM）、count は下書きの対象の人数（その月の承認済みの記録があり、モニタリングも確認待ちの下書きも無い方）。本人の設定がオフなら出ない。通知はしない（下書きができたら ai_proposal.created が届く）。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count, source]
    severity: info
    audience: { rule: monitoring_delegate }
    playbook: care_monitoring_draft
  care_manager.assignment_changed:
    label: 担当替え（主任ケアマネ・管理者）
    description: 主任ケアマネか管理者が利用者の担当ケアマネを替えた（POST /api/cm/assignments、ROLE_MODEL §11.2・R2。理由は履歴だけ）。fromCareManagerId は前の担当（無ければ省略）、toCareManagerId は新しい担当（事業所内）、effectiveFrom は効力発生日（YYYY-MM-DD）。作成中の下書き（ケアプラン・提供票・モニタリング）は新しい担当に引き継がれる。管理者は定時報告の「前回の報告からの動き」で件数を見る。
    aggregate: resident
    payload: [residentId, fromCareManagerId, toCareManagerId, effectiveFrom]
    severity: info
    audience: { rule: assignment_parties }
    notify: { template: care_manager.assignment_changed, variants: [care_manager.assignment_changed.manager], digestMinutes: 2 }
  care_manager.cover_started:
    label: 代行の開始
    description: 不在のケアマネの代行が始まった（ROLE_MODEL §11.3・R3）。開始が付与の時点なら付与（POST /api/cm/covers）と同時に、先の日付なら開始の後に care-worker が 1 回だけ出す。residentCount は代行の範囲の人数（全員の付与はそのときの担当の数）、startsAt / endsAt は期間（endsAt は期間の後の最初の時刻）。期間中、範囲の利用者の通知は代行者だけに届く。
    aggregate: care_manager_cover
    payload: [coverId, absentCareManagerId, coverCareManagerId, startsAt, endsAt, residentCount]
    severity: info
    audience: { rule: cover_parties }
    notify: { template: care_manager.cover_started, digestMinutes: 2 }
  care_plan.review_requested:
    label: ケアプランの確認の依頼（主任ケアマネへ）
    description: 担当ケアマネが主任ケアマネにケアプランの版の確認を頼んだ（POST /api/cm/care-plans/:id/review-requests、または事業所設定「新規・区分変更のときは確認を依頼する」がオンのときの new / change の交付で自動に＝auto、ROLE_MODEL R4）。交付は止めない。主任は業務 Web で確認のコメントを書く。
    aggregate: care_plan_set
    payload: [carePlanSetId, residentId, version, careManagerId, auto]
    severity: info
    audience: { rule: lead_reviewers }
    notify: { template: care_plan.review_requested, digestMinutes: 2 }
  visit_care_plan.submitted:
    label: 訪問介護計画書の提出
    aggregate: visit_care_plan
    payload: [visitCarePlanId, residentId, version]
    severity: info
    audience: { rule: managers_except_submitter, fallback: { roles: [admin], templates: [visit_care_plan.submitted.fallback] } }
    notify: { template: visit_care_plan.submitted, variants: [visit_care_plan.submitted.fallback], digestMinutes: 0 }
  visit_care_plan.approved:
    label: 訪問介護計画書の承認
    description: 計画書が有効になった。mode は confirmed（介護担当の確定、ROLE_MODEL §4.3）か approved（旧い流れの承認）、source は下書きの出所（manual / ai / ai_edited）、similarAcknowledged は類似文言の確認つきか。
    aggregate: visit_care_plan
    payload: [visitCarePlanId, residentId, version, mode, source, similarAcknowledged]
    severity: info
    audience: { rule: plan_author }
    notify: { template: visit_care_plan.approved, digestMinutes: 2 }
  visit_care_plan.sent:
    label: 訪問介護計画書の送付
    aggregate: visit_care_plan
    payload: [visitCarePlanId, residentId, version]
    severity: info
  visit_care_plan.delivered:
    label: 訪問介護計画書の交付（事業所内）
    description: 確定した計画書を、事業所内の担当ケアマネへシステム内で交付した（PDF の生成の後に care-worker が記録）。受領確認は業務 Web で。
    aggregate: visit_care_plan
    payload: [visitCarePlanId, residentId, version, careManagerId]
    severity: info
    audience: { rule: resident_care_manager }
    notify: { template: visit_care_plan.delivered, digestMinutes: 2 }
  classification.signal_detected:
    label: 区分変更の兆候
    aggregate: classification_signal
    payload: [signalId, residentId, direction, score]
    severity: warning
    audience: { rule: managers, include: [resident_care_manager] }
    notify: { template: classification.signal_detected, variants: [classification.signal_detected.care_manager], digestMinutes: 2 }
    playbook: care_signal_note
  classification.change_applied:
    label: 区分変更の反映
    aggregate: classification_change
    payload: [changeId, residentId, status]
    severity: info
    audience: { rule: managers_except_actor, include: [resident_care_manager] }
    notify: { template: classification.change_applied, digestMinutes: 2 }
  classification.change_decided:
    label: 区分変更の決定
    aggregate: classification_change
    payload: [changeId, residentId, status]
    severity: info
    audience: { rule: managers_except_actor, include: [resident_care_manager] }
    notify: { template: classification.change_decided, digestMinutes: 2 }
  billing_hold.started:
    label: 請求保留の開始
    aggregate: billing_hold
    payload: [holdId, contractId, residentId, changeId, months]
    severity: warning
    audience: { rule: billing_except_actor }
    notify: { template: billing_hold.started, digestMinutes: 2 }
  billing_hold.released:
    label: 請求保留の解除
    aggregate: billing_hold
    payload: [holdId, contractId, residentId, changeId, months]
    severity: info
    audience: { rule: billing_except_actor }
    notify: { template: billing_hold.released, digestMinutes: 2 }
  leave_request.submitted:
    label: 希望休の申請
    aggregate: leave_request
    payload: [leaveRequestId, employeeUserId, date]
    severity: info
    audience: { rule: approvers_except_applicant, include: [lead_care_managers], fallback: { roles: [admin], templates: [leave_request.submitted.fallback, leave_request.submitted.fallback.lead] } }
    notify: { template: leave_request.submitted, variants: [leave_request.submitted.fallback, leave_request.submitted.fallback.lead], digestMinutes: 2 }
  leave_request.decided:
    label: 希望休の結果
    aggregate: leave_request
    payload: [leaveRequestId, employeeUserId, date, decision]
    severity: info
    audience: { rule: applicant }
    notify: { template: leave_request.decided, variants: [leave_request.decided.approved, leave_request.decided.returned], digestMinutes: 0 }
  shift.published:
    label: シフトの公開
    aggregate: shift
    payload: [shiftId, month, count]
    severity: info
    audience: { rule: shift_employees }
    notify: { template: shift.published, digestMinutes: 0 }
  shift.assignment_changed:
    label: シフト割当の変更
    aggregate: shift_assignment
    payload: [shiftId, assignmentId, employeeUserId, date, action]
    severity: info
    audience: { rule: assignment_employee }
    notify: { template: shift.assignment_changed, digestMinutes: 2 }
  attendance.month_closed:
    label: 勤怠月次の締め
    aggregate: attendance_month
    payload: [month, count]
    severity: info
    audience: { rule: payroll_operator, fallback: { roles: [admin] } }
    notify: { template: attendance.month_closed, digestMinutes: 0 }
  payslip.issued:
    label: 給与明細の発行
    aggregate: payslip
    payload: [payslipId, month, employeeUserId]
    severity: info
    audience: { rule: employee_self }
    notify: { template: payslip.issued, digestMinutes: 0 }
  safety_check.started:
    label: 安否確認の開始・再通知
    aggregate: safety_check
    payload: [safetyCheckId, kind, count]
    severity: warning
    audience: { rule: safety_pending_responders }
    notify: { template: safety_check.started, variants: [safety_check.reminder], digestMinutes: 0, quiet: exempt }
  safety_check.alert:
    label: 安否確認のアラート
    aggregate: safety_check
    payload: [safetyCheckId, kind, subjectId, count]
    severity: critical
    audience: { rule: safety_managers }
    notify: { template: safety_check.alert.response, variants: [safety_check.alert.urgent, safety_check.alert.overdue], digestMinutes: 0, quiet: exempt }
  message.posted:
    label: チャットの新着
    aggregate: chat_message
    payload: [threadId, messageId]
    severity: info
    audience: { rule: thread_audience_except_sender }
    notify: { template: message.posted, variants: [message.posted.announcement], digestMinutes: 2 }
  care_document.due:
    label: 帳票の期限
    aggregate: care_document
    payload: [residentId, documentType, dueDate, kind, documentId, month, staffUserId, status]
    severity: warning
    audience: { rule: document_assignee_or_managers }
    notify: { template: care_document.due, digestMinutes: 2 }
  care_document.completed:
    label: 帳票の完了
    aggregate: care_document
    payload: [documentId, residentId, documentType, version, month, staffUserId]
    severity: info
    audience: { rule: managers_except_completer }
    notify: { template: care_document.completed, digestMinutes: 2, default: off }
  shift.swap_offered:
    label: 振替の依頼
    aggregate: shift_swap
    payload: [swapId, scheduleId, staffUserId, date]
    severity: info
    audience: { rule: swap_target_staff }
    notify: { template: shift.swap_offered, digestMinutes: 0 }
  shift.swap_decided:
    label: 振替の結果
    aggregate: shift_swap
    payload: [swapId, scheduleId, staffUserId, date, decision, userId]
    severity: info
    audience: { rule: swap_offerer_or_managers }
    notify: { template: shift.swap_decided.accepted, variants: [shift.swap_decided.consult, shift.swap_decided.declined], digestMinutes: 0 }
  incident.reported:
    label: ヒヤリハットの報告
    aggregate: incident_report
    payload: [incidentId, residentId, severity, staffUserId]
    severity: warning
    audience: { rule: managers_except_reporter }
    notify: { template: incident.reported, variants: [incident.reported.care_manager], digestMinutes: 0 }
  record_correction.requested:
    label: 記録の訂正申請
    aggregate: record_correction
    payload: [correctionId, recordId, residentId, staffUserId]
    severity: info
    audience: { rule: managers_except_requester, fallback: { roles: [admin], templates: [record_correction.requested.fallback] } }
    notify: { template: record_correction.requested, variants: [record_correction.requested.fallback], digestMinutes: 2 }
  record_correction.decided:
    label: 訂正申請の結果
    aggregate: record_correction
    payload: [correctionId, recordId, decision, staffUserId]
    severity: info
    audience: { rule: correction_requester }
    notify: { template: record_correction.decided.approved, variants: [record_correction.decided.rejected], digestMinutes: 0 }
  care_inbox.received:
    label: 連携ボックスの受信
    aggregate: care_inbox_item
    payload: [inboxId, kind, residentId, careManagerId, count, userId]
    severity: info
    audience: { rule: managers }
    notify: { template: care_inbox.received, digestMinutes: 2 }
  dunning.issued:
    label: 督促状の発行
    aggregate: dunning_letter
    payload: [dunningId, stage, amount, residentId, count, userId]
    severity: info
    audience: { rule: billing }
    notify: { template: dunning.issued, digestMinutes: 2 }
  business_report.ready:
    label: 定時業務報告の準備完了
    aggregate: business_report
    payload: [reportId, date, slot, kind, count, userId]
    severity: info
    audience: { rule: report_recipients }
    notify: { template: business_report.ready, digestMinutes: 0, quiet: exempt }
  provision.missing:
    label: 翌月の提供票の未作成（念押し）
    description: 担当ケアマネ 1 人分の、翌月の提供票（care_provision_plan）がまだ交付されていない方の人数（ROLE_MODEL §5.2）。毎月 20 日と 25 日から（threshold 20 / 25）、care-worker の期限のジョブが 1 日 1 回。count はその回に新しく数えた方（同じ方・同じしきい値は 2 回数えない）、month は対象月（YYYY-MM）、dueDate はその月の末日。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count, threshold, dueDate]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: provision.missing, digestMinutes: 0 }
  certification.expiring:
    label: 認定の有効期間の終了（60 日前・30 日前）
    description: 担当ケアマネ 1 人分の、認定の有効期間の終了（resident_certification、記録が無ければ第 1 表・フェースシート）が 60 日以内・30 日以内になった方の人数（ROLE_MODEL §11.8）。申請中の方は数えない。threshold はその回のいちばん小さいしきい値、within30Days は 30 日以内の方、date はいちばん早い終了日。介護度は載せない。
    aggregate: care_manager
    payload: [careManagerId, userId, count, threshold, within30Days, date]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: certification.expiring, digestMinutes: 0 }
  care_plan.period_expiring:
    label: ケアプランの計画期間の終了（30 日前）
    description: 担当ケアマネ 1 人分の、交付済みのケアプランの版（care_plan_set）の計画期間の終了が 30 日以内になった方の人数（ROLE_MODEL §11.8）。date はいちばん早い終了日。
    aggregate: care_manager
    payload: [careManagerId, userId, count, threshold, date]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: care_plan.period_expiring, digestMinutes: 0 }
  monitoring.due:
    label: 今月のモニタリングの未確定（月末の 5 日前）
    description: 担当ケアマネ 1 人分の、その月の居宅訪問の記録（care_monitoring、C4 の月 1 回の居宅訪問 homeVisitStatus）がまだ済んでいない方の人数（記録なし・未確定・居宅訪問でない確定。ROLE_MODEL §5.2、E2）。月末の 5 日前から。aiDrafts はそのうち確認待ちの AI の要約（参考）がある方、month は対象月（YYYY-MM）、dueDate はその月の末日。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count, aiDrafts, dueDate]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: monitoring.due, digestMinutes: 0 }
  escalation.raised:
    label: 期限を過ぎた対応のご相談（AI エスカレーション）
    description: 担当者あての【対応のお願い】（と未打刻の【至急】）が、期限を過ぎても業務の状態として片付いていないときに 1 回だけ（ROLE_MODEL §6、care-worker）。知らせる相手（notifyRole：admin / manager / lead_care_manager）ごとに 1 件。count は件数、kinds は種類（escalation.kind）、careManagerCount はケアマネの分のときの該当するケアマネの人数。種類ごとの件数・経過は escalation の行（care-api が通知のときに数え直し、すべて片付いていれば送らない）。氏名・利用者・金額は載せない。
    aggregate: escalation
    payload: [notifyRole, count, kinds, careManagerCount]
    severity: warning
    audience: { rule: escalation_recipients, include: [lead_care_managers], fallback: { roles: [admin], templates: [escalation.raised, escalation.raised.lead.fallback] } }
    notify: { template: escalation.raised, variants: [escalation.raised.lead, escalation.raised.lead.fallback, escalation.raised.missed_check_in], digestMinutes: 2 }

  portal_message.received:
    label: ポータルの新着連絡（外部のケアマネから）
    description: 事業所外のケアマネがケアマネポータルの連絡欄に書いた（C6・E2）。messageId は連絡の行、residentId・careManagerId は利用者とケアマネのマスタの行、count は 1、topic は連絡の種類のコード（G4・G6：care_level_change / meeting_schedule / plan_change / inquiry / other）。本文・氏名は載せない。介護担当が読んだ後は送らない。
    aggregate: portal_message
    payload: [messageId, residentId, careManagerId, count, topic]
    severity: info
    audience: { rule: office_managers, fallback: { roles: [admin], templates: [portal_message.received.fallback] } }
    notify: { template: portal_message.received, variants: [portal_message.received.fallback], digestMinutes: 2 }
  benefit_statement.due:
    label: 給付管理票の締切（前月分、10 日）
    description: 担当ケアマネ 1 人分の、前月の給付管理票（care_benefit_statement）がまだ確定していない方の人数（前月の提供票を交付した方、C5・E2）。毎月 5 日と 9 日から（threshold 5 / 9）、care-worker の AI 秘書の知らせのジョブが 1 日 1 回。count はその回に新しく数えた方、month は対象月（YYYY-MM）、dueDate は提出の締切（その月の 10 日）。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count, threshold, dueDate]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: benefit_statement.due, digestMinutes: 0 }
  benefit_review.imported:
    label: 給付管理票の返戻・保留の取込み
    description: 請求・給与担当が取り込んだ国保連の返戻・保留（care_benefit_review、直していないもの、取込みから 14 日以内、C5・E2）を、その給付管理票の利用者の担当ケアマネ 1 人分の件数で。returned は返戻、held は保留、month はいちばん古いサービス提供月。理由の文・被保険者番号は載せない。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count, returned, held]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: benefit_review.imported, digestMinutes: 0 }
  caseload.band_crossed:
    label: 担当件数の逓減の区分
    description: G6：居宅介護支援の事業所の判定（G5、事業所の件数〔要支援は換算〕÷ ケアマネの常勤換算の合計＝取扱件数 perFte）が、居宅介護支援費の逓減の区分（band ii / iii）に上がった（1 日 1 回、下がったときは知らせない）。count は事業所の担当の人数、fte は常勤換算の合計、threshold はその区分の境の件数、careManagerCount は 1 人ずつの件数（目安）で区分に入っているケアマネの人数（補足）、officeId は居宅介護支援の事業所、month は対象月。E2 の形（ケアマネ 1 人の件数：careManagerId・userId、aggregate care_manager）の行も受ける。
    aggregate: office
    payload: [careManagerId, userId, officeId, month, band, count, threshold, perFte, fte, careManagerCount]
    severity: info
    audience: { rule: caseload_parties }
    notify: { template: caseload.band_crossed, variants: [caseload.band_crossed.lead], digestMinutes: 0 }
  usage_consent.missing:
    label: 利用票の同意の記録がまだ（その月の交付済みの利用票）
    description: 担当ケアマネ 1 人分の、その月の交付済みの提供票の版（利用票）で利用者の同意の記録（同意日・方法・記録者、C3・G1）が無いものの数。交付から 3 日たった版だけ、版ごとに 1 回、care-worker の AI 秘書の知らせのジョブが 1 日 1 回。month は対象月（YYYY-MM）。同意の中身・氏名は載せない。
    aggregate: care_manager
    payload: [careManagerId, userId, month, count]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: usage_consent.missing, digestMinutes: 0 }
  cm_records.attention:
    label: 記録の一覧の要対応（アセスメント・第 4 表・第 5 表）
    description: 担当ケアマネ 1 人分の、記録の一覧（E1）で要対応の方の人数（count）と一覧ごとの人数（assessments 再アセスメントの目安・未実施、conferences 計画の版の後に担当者会議が未開催、progress 支援経過が 30 日超・記録なし）。毎週月曜日に 1 回、1 人以上のときだけ（G1）。
    aggregate: care_manager
    payload: [careManagerId, userId, count, assessments, conferences, progress]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: cm_records.attention, digestMinutes: 0 }
  provider_message.received:
    label: ポータルの新着連絡（事業所の口座から）
    description: 事業所そのもののポータルの口座（G4、事業所のマスタの行に結び付く）が連絡欄に書いた（G6）。messageId は連絡の行、residentId は利用者、providerId は事業所のマスタの行、count は 1、topic は連絡の種類のコード。本文・氏名は載せない。担当ケアマネが読んだ後は送らない。
    aggregate: portal_message
    payload: [messageId, residentId, providerId, count, topic]
    severity: info
    audience: { rule: resident_care_manager }
    notify: { template: provider_message.received, digestMinutes: 2 }
  provider_actuals.received:
    label: ポータルで受けた実績（UPJSK）
    description: 提供票を渡した事業所がポータルで実績（標準仕様の CSV、第 6 表の実績）を送った（G4・G6）。publicationId は提供票の公開の行、residentId は利用者、month は対象月、count は実績の行の数、days は実績の日数の合計、version は実績の版。サービスの中身・被保険者番号・事業所名は載せない。
    aggregate: care_provision_actual
    payload: [publicationId, residentId, month, count, days, version]
    severity: info
    audience: { rule: resident_care_manager }
    notify: { template: provider_actuals.received, digestMinutes: 2 }
  conference_schedule.upcoming:
    label: サービス担当者会議の予定の念押し（予定日の 2 日前）
    description: 担当ケアマネ 1 人分の、会議の予定（G2、予定のまま）で予定日が今日から 2 日先までのものの数（予定ごと・予定日ごとに 1 回、care-worker の AI 秘書の知らせのジョブが 1 日 1 回、G6）。date はいちばん近い予定日、scheduleId は 1 件のときの予定の行。場所・出席者・利用者名は載せない。
    aggregate: care_manager
    payload: [careManagerId, userId, count, date, scheduleId]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: conference_schedule.upcoming, digestMinutes: 0 }
  conference_schedule.overdue:
    label: 予定日を過ぎたサービス担当者会議の予定
    description: 担当ケアマネ 1 人分の、予定日を過ぎても予定のまま（開催の記録も取りやめもしていない）の会議の予定の数（予定ごとに 1 回、G6）。date はいちばん古い予定日、scheduleId は 1 件のときの予定の行。
    aggregate: care_manager
    payload: [careManagerId, userId, count, date, scheduleId]
    severity: info
    audience: { rule: deadline_care_manager }
    notify: { template: conference_schedule.overdue, digestMinutes: 0 }
  public_master.release_ready:
    label: 公的マスタの改定案（検証を通った）
    description: P2a：取り込んだファイル・手入力の公的マスタの改定案が検証を通った（validated、承認を待つ）。releaseId は版、dataset はデータセットのコード（service_codes / limits / unit_prices / caseload_rules / kokuho_interface / review_reasons）、validFrom は適用日の案、rowCount は行・値の数、errors・warnings は検証の件数。値・ファイルの中身・版の名前は載せない。承認・却下の後は送らない。
    aggregate: pm_release
    payload: [releaseId, dataset, validFrom, rowCount, errors, warnings]
    severity: info
    audience: { rule: public_master_admins_except_author }
    notify: { template: public_master.release_ready, digestMinutes: 0 }
  public_master.release_failed:
    label: 公的マスタの改定案（誤りあり・解析できない）
    description: P2a：公的マスタの改定案の検証で誤りがあった（draft）、または取り込んだファイルを解析できなかった（aggregate pm_artifact、artifactId、errors 1、改定案は作らない）。payload は release_ready と同じ形。
    aggregate: pm_release
    payload: [releaseId, artifactId, dataset, validFrom, rowCount, errors, warnings]
    severity: warning
    audience: { rule: public_master_admins_except_author }
    notify: { template: public_master.release_failed, digestMinutes: 0 }
  public_master.effective_soon:
    label: 公的マスタの版の有効化（7 日前）
    description: P2a：承認した公的マスタの版の適用日が 1〜7 日後（care-worker の jobs/public-masters.mjs、毎日 06:00 JST、テナントごと・版ごとに 1 回）。daysAhead は適用日までの日数。有効になった後・取り消された後は送らない。
    aggregate: pm_release
    payload: [releaseId, dataset, validFrom, rowCount, daysAhead]
    severity: info
    audience: { rule: public_master_admins }
    notify: { template: public_master.effective_soon, digestMinutes: 0 }
  public_master.update_detected:
    label: 公的マスタの更新の検知
    description: P3a：収集役（pm-collector の pm.watch）が出典の一覧・頁で新しい版（versions、確定版・一部訂正）・知らせ（notices、その N・案・国保中央会の版の一覧・介護保険最新情報の号）・頁や添付の変化（changes）を見つけた（1 回の確認で各テナントに 1 件）。detectionId はそのうち最初の検知、count は件数。題名・URL・値は載せない。新しい版は収集役が取得・解析して改定案（release_ready / release_failed）にする。
    aggregate: pm_detection
    payload: [detectionId, count, versions, notices, changes]
    severity: info
    audience: { rule: public_master_detected_admins }
    notify: { template: public_master.update_detected, digestMinutes: 0 }
  concentration.over:
    label: 特定事業所集中減算の 80% 超
    description: いまの判定期間（term、YYYY-03 / YYYY-09）に、居宅介護支援の事業所の計画で同じ法人・事業所の紹介率が 80% を超えたサービスの種類（serviceTypes、11 / 15 / 78 / 17）と数（C7・E2。1 日 1 回、80% を超えたときだけ）。事業所名・割合・利用者は載せない。implicit の事業所（居宅介護支援の事業所のマスタが無い事業所）は aggregateId が事業所（tenant）。
    aggregate: office
    payload: [officeId, term, count, serviceTypes]
    severity: info
    audience: { rule: concentration_recipients }
    notify: { template: concentration.over, digestMinutes: 0 }

templates:
  visit_record.submitted:
    intent: action
    action: 業務 Web の「記録」で内容を確認し、承認の判断をお願いします。
    description: 未承認の訪問記録の件数（作成者ごとに自分の分を除いた件数）。
    params: { count: { type: integer }, pendingCount: { type: integer }, submittedAt: { type: datetime }, time: { type: time } }
  visit_record.submitted.fallback:
    intent: approval
    action: 業務 Web の「記録」で内容を確認し、承認の判断をお願いします。
    description: 管理者への回付（承認できる介護担当が本人しかいない＝self、または 1 人もいない）。ボタンは無く、判断は業務 Web で。
    params: { count: { type: integer }, pendingCount: { type: integer }, submittedAt: { type: datetime }, time: { type: time }, self: { type: flag, optional: true } }
  visit_record.returned:
    intent: action
    action: コメントを確認し、記録を直して再提出をお願いします（業務 Web の「記録」）。
    params: { returnedAt: { type: datetime }, time: { type: time } }
  visit.missed_check_in.assignee:
    intent: urgent
    action: 訪問中でしたら開始の打刻を、遅れる・伺えない場合は事業所へのご連絡をお願いします。
    params: { plannedStart: { type: datetime }, time: { type: time }, date: { type: monthday }, minutesLate: { type: integer } }
  visit.missed_check_in.manager:
    intent: urgent
    action: 担当職員に状況を確認し、必要なら代わりの手配をお願いします（業務 Web の「訪問予定」）。
    params: { plannedStart: { type: datetime }, time: { type: time }, date: { type: monthday }, minutesLate: { type: integer } }
  classification.signal_detected:
    intent: action
    action: 業務 Web の「区分変更」で根拠を確認し、区分変更に向けた対応が必要かご判断をお願いします。
    params: { count: { type: integer }, detectedAt: { type: datetime }, time: { type: time } }
  classification.signal_detected.care_manager:
    intent: consult
    action: 業務 Web の「区分変更の兆候」で AI のまとめと根拠の記録を確かめ、区分変更の申請を検討するかお決めください。
    description: 事業所内の担当ケアマネ（代行中は代行者）あての【ご相談】。兆候の向き（健康の情報）は載せない。
    params: { count: { type: integer }, detectedAt: { type: datetime }, time: { type: time } }
  visit_care_plan.submitted:
    intent: action
    action: 業務 Web の「訪問介護計画書」で内容を確認し、承認の判断をお願いします。
    params: { count: { type: integer }, submittedAt: { type: datetime }, time: { type: time } }
  visit_care_plan.submitted.fallback:
    intent: approval
    action: 業務 Web の「訪問介護計画書」で内容を確認し、承認の判断をお願いします。
    description: 管理者への回付（旧い流れの計画書。self は提出者が唯一の介護担当）。
    params: { count: { type: integer }, submittedAt: { type: datetime }, time: { type: time }, self: { type: flag, optional: true } }
  leave_request.submitted:
    intent: action
    action: 業務 Web の「希望休」で確認し、承認か差戻しをお願いします。
    params: { count: { type: integer }, date: { type: monthday, optional: true } }
  leave_request.submitted.fallback:
    intent: approval
    action: 業務 Web の「希望休」で確認し、承認か差戻しをお願いします。
    description: 管理者への回付（承認できる介護担当が本人しかいない＝self、または 1 人もいない）。
    params: { count: { type: integer }, date: { type: monthday, optional: true }, self: { type: flag, optional: true } }
  leave_request.submitted.fallback.lead:
    intent: approval
    action: 業務 Web の「希望休」で確認し、承認か差戻しをお願いします。
    description: ケアマネの希望休の管理者への回付（主任ケアマネが本人だけ＝self、または 1 人もいない）。
    params: { count: { type: integer }, date: { type: monthday, optional: true }, self: { type: flag, optional: true } }
  leave_request.decided:
    intent: info
    params: { date: { type: monthday, optional: true } }
  leave_request.decided.approved:
    intent: info
