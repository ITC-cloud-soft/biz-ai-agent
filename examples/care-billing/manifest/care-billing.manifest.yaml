    action: 業務 Web の「給付管理票」の「返戻・保留あり」で該当の票を確かめ、直した票を作って確定してください。
    description: 担当ケアマネ（代行中は代行者）あての AI 秘書の【対応のお願い】（E2）。返戻・保留の件数とサービス提供月だけ（理由の文は載せない）。
    params: { count: { type: integer }, month: { type: month, optional: true }, returned: { type: integer, optional: true }, held: { type: integer, optional: true } }
  caseload.band_crossed:
    intent: info
    description: ケアマネあての AI 秘書の【ご報告】。G6：事業所の判定（office 1）の取扱件数（perFte、小数 1 桁）・常勤換算（fte）・事業所の担当の人数・逓減の区分の番号（band 2 = ii、3 = iii）・境の件数・本人の目安で区分に入っている人数（careManagers）。E2 の形は本人の担当の人数。
    params: { count: { type: integer, optional: true }, month: { type: month, optional: true }, band: { type: integer, optional: true }, threshold: { type: integer, optional: true }, office: { type: flag, optional: true }, perFte: { type: number, optional: true }, fte: { type: number, optional: true }, careManagers: { type: integer, optional: true } }
  caseload.band_crossed.lead:
    intent: action
    action: 業務 Web の「件数・集中減算」でチームの件数を確かめ、必要なら担当の調整をご検討ください。
    description: 同じ事業所の主任ケアマネあて（E2・G6）。ケアマネ名は載せない（取扱件数・常勤換算・人数・区分の番号だけ）。
    params: { count: { type: integer, optional: true }, month: { type: month, optional: true }, band: { type: integer, optional: true }, threshold: { type: integer, optional: true }, office: { type: flag, optional: true }, perFte: { type: number, optional: true }, fte: { type: number, optional: true }, careManagers: { type: integer, optional: true } }
