# Business manifest of ケアビリング (care-billing), derived from the code of the care-ai-native repository (services/care-api,
# plugins/care-tools, plugins/care-notify, dsh/runtime-profile). Bridge protocol v1 (@dsh-bridge/protocol).
# Source of truth: care-ai-native services/care-api/bridge/care-billing.manifest.yaml (care-api serves it at GET /bridge/v1/manifest);
# the framework keeps a byte-identical copy in examples/care-billing/manifest/ (checked by services/care-api/bridge/test/manifest.test.mjs).
# Validate with
#   node <framework>/packages/protocol/bin/bridge-validate.mjs manifest services/care-api/bridge/care-billing.manifest.yaml
# It contains NO personal data: IDs, roles, rule names, templates and instructions only.
#
# Sources of truth of its content (the manifest mirrors them; services/care-api/bridge/test/care-sync.test.mjs keeps them from drifting):
#   events            services/care-api/src/events.mjs (AI_EVENT_TYPES + the emitAiEvent call sites for the per-type payload keys)
#   audience rules    services/care-api/src/repo/notifications.mjs (ruleFor)
#   notify templates  plugins/care-notify/src/templates.js (wording stays there; the manifest declares the typed parameters)
#   tools             plugins/care-tools/src/*.js + the delegated route tables of services/care-api/src/routes/*.mjs
#   playbooks         dsh/runtime-profile/auto-tasks/*.json, dsh/runtime-profile/proactive.config.json, plugins/care-notify/src/ai-report.js
#   daily report      services/care-api/src/repo/business-report.mjs
bridge: 1
version: 2026-10-29
system:
  id: care-billing
  name: ケアビリング
  locale: ja-JP
  timezone: Asia/Tokyo
  description: 介護事業所（訪問介護・居住系）の請求・訪問記録・シフト・帳票の業務システム。

