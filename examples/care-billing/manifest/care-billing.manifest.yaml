    intent: action
    action: 業務 Web の「給付管理票」で前月分を作って確定してください（確定した票を請求・給与担当が国保連に伝送します）。
    description: 担当ケアマネ（代行中は代行者）あての AI 秘書の【対応のお願い】（E2）。前月の給付管理票が未確定の方の人数・対象月・締切（10 日）だけ。
    params: { count: { type: integer }, month: { type: month, optional: true }, threshold: { type: integer, optional: true }, dueDate: { type: monthday, optional: true } }
