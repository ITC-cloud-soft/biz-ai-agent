roles:
  admin:
    label: 管理者
    scope: all
    delegation: propose
  manager:
    label: 介護担当（サービス提供責任者）
    scope: all
    delegation: propose
    description: 記録・計画書・帳票・シフトなど介護の業務を扱う。請求の確定・承認の判断はしない（管理者）。
  billing:
    label: 請求・給与担当
    scope: all
    delegation: propose
    description: 請求・入金・取込を扱い、給与計算を行う（AI は給与を扱わない）。訪問記録（健康情報）は読めない。
  staff:
    label: 現場職員
    scope: assigned
    delegation: propose
    description: 自分の訪問・自分の記録だけ。
  care_manager:
    label: ケアマネジャー（事業所内）
    scope: assigned
    delegation: propose
    description: 担当利用者だけを扱う。請求の金額・給与は扱わない。併設の居宅介護支援事業所のケアマネで、自分の担当利用者（代行を含む）だけ。AI の提案はモニタリングの下書きだけ（本人の設定でオン・オフ、自動タスクは本人ごとの委任 care_manager=each）。

