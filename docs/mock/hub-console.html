<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub 管理控制台（mock）</title>
<!--
  Agent Hub 管理控制台的 HTML mock（docs/MULTI_AGENT_PLATFORM.md v0.3：管理界面统一在 Hub）。
  外观沿用 packages/agent-settings/web/app.css（web-kit 的 --dbw-* 令牌 + as-* 组件）。
  单文件、无依赖、可直接用浏览器打开。数据全部虚构；按钮只改变本页内的状态，不连任何服务。
-->
<style>
:where(:root) {
  --dbw-font: "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --dbw-font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Menlo, Consolas, monospace;
  --dbw-text: #0f172a; --dbw-text-2: #475569; --dbw-text-3: #64748b;
  --dbw-bg: #f4f6fa; --dbw-surface: #ffffff; --dbw-surface-2: #f1f4f9; --dbw-surface-3: #e2e8f0;
  --dbw-border: #e3e8ef; --dbw-border-strong: #cbd5e1;
  --dbw-primary: #4f46e5; --dbw-primary-hover: #4338ca; --dbw-primary-soft: #eef2ff; --dbw-primary-soft-text: #3730a3; --dbw-on-primary: #fff;
  --dbw-success: #15803d; --dbw-success-soft: #ecfdf3; --dbw-warning: #b45309; --dbw-warning-soft: #fff7e6;
  --dbw-danger: #c2410c; --dbw-danger-soft: #fff1ec; --dbw-info: #2563eb; --dbw-info-soft: #eff5ff;
  --dbw-radius: 10px; --dbw-shadow: 0 1px 2px rgb(15 23 42 / 0.04), 0 1px 1px rgb(15 23 42 / 0.03);
  --as-radius-lg: 14px; --as-side: 248px; --as-ring: 0 0 0 3px rgb(79 70 229 / 0.18);
}
[data-dbw-theme="dark"] {
  --dbw-text: #e6e9f0; --dbw-text-2: #b5bdcc; --dbw-text-3: #8b95a7;
  --dbw-bg: #0b0f17; --dbw-surface: #121826; --dbw-surface-2: #182033; --dbw-surface-3: #243049;
  --dbw-border: #222b3d; --dbw-border-strong: #33405a;
  --dbw-primary: #8b8cf8; --dbw-primary-hover: #a5a6fb; --dbw-primary-soft: #1d2142; --dbw-primary-soft-text: #c7c8ff; --dbw-on-primary: #0b0f17;
  --dbw-success: #4ade80; --dbw-success-soft: #0d2a1b; --dbw-warning: #fbbf24; --dbw-warning-soft: #2b2110;
  --dbw-danger: #fb923c; --dbw-danger-soft: #2d1710; --dbw-info: #7aa7ff; --dbw-info-soft: #14203a;
  --as-ring: 0 0 0 3px rgb(139 140 248 / 0.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--dbw-bg); }
body { padding-top: 34px; font-family: var(--dbw-font); font-size: 14px; line-height: 1.55; color: var(--dbw-text); -webkit-font-smoothing: antialiased; }

/* ── the settings app's shell and parts (packages/agent-settings/web/app.css) ── */
.as-app { display: grid; grid-template-columns: var(--as-side) minmax(0, 1fr); min-height: calc(100vh - 34px); }
.as-side { position: sticky; top: 34px; height: calc(100vh - 34px); display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 16px; background: var(--dbw-surface); border-right: 1px solid var(--dbw-border); }
.as-brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
.as-brand__mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #ec4899 120%); box-shadow: 0 6px 16px -6px rgb(99 102 241 / 0.7); flex: none; }
.as-brand__text { display: flex; flex-direction: column; min-width: 0; }
.as-brand__text strong { font-size: 15px; letter-spacing: -0.01em; }
.as-brand__text span { font-size: 12px; color: var(--dbw-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.as-nav { display: flex; flex-direction: column; gap: 2px; }
.as-nav__sec { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--dbw-text-3); padding: 12px 10px 4px; }
.as-nav__item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--dbw-text-2); text-decoration: none; font-weight: 500; transition: background .12s, color .12s; }
.as-nav__item:hover { background: var(--dbw-surface-2); color: var(--dbw-text); }
.as-nav__item[aria-current="page"] { background: var(--dbw-primary-soft); color: var(--dbw-primary-soft-text); }
.as-nav__item[aria-current="page"] svg { color: var(--dbw-primary); }
.as-nav__item:focus-visible { outline: none; box-shadow: var(--as-ring); }
.as-nav__badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--dbw-primary); color: var(--dbw-on-primary); }
.as-nav__dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; }
.as-side__foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.as-lang { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px; background: var(--dbw-surface-2); color: var(--dbw-text-3); }
.as-lang svg { margin: 0 4px 0 6px; flex: none; }
.as-lang button { flex: 1; font: inherit; font-size: 12px; padding: 5px 6px; border: 0; border-radius: 7px; background: transparent; color: var(--dbw-text-2); cursor: pointer; white-space: nowrap; }
.as-lang button[aria-pressed="true"] { background: var(--dbw-surface); color: var(--dbw-text); box-shadow: var(--dbw-shadow); font-weight: 600; }
.as-user { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--dbw-text-2); padding: 0 6px; }
.as-user__avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--dbw-surface-3); color: var(--dbw-text); font-weight: 700; font-size: 12px; flex: none; }
.as-user small { display: block; font-size: 11.5px; color: var(--dbw-text-3); }

.as-main { min-width: 0; padding: 34px clamp(16px, 4vw, 48px) 64px; max-width: 1240px; width: 100%; }
.as-page-head { margin-bottom: 22px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.as-page-head > div:first-child { flex: 1; min-width: 240px; }
.as-page-head__eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--dbw-primary); }
.as-page-head__eyebrow a { color: inherit; text-decoration: none; }
.as-page-head__eyebrow a:hover { text-decoration: underline; }
.as-page-head h1 { margin: 4px 0 6px; font-size: 26px; line-height: 1.25; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.as-page-head p { margin: 0; max-width: 78ch; color: var(--dbw-text-2); }
.as-page-head__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.as-pages { display: flex; flex-direction: column; gap: 18px; animation: as-in .18s ease-out; }
@keyframes as-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.as-card { background: var(--dbw-surface); border: 1px solid var(--dbw-border); border-radius: var(--as-radius-lg); box-shadow: var(--dbw-shadow); min-width: 0; }
.as-card__head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 0; }
.as-card__icon { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--dbw-primary-soft); color: var(--dbw-primary); }
.as-card__titles { flex: 1; min-width: 0; }
.as-card__titles h2 { margin: 1px 0 2px; font-size: 16px; letter-spacing: -0.01em; }
.as-card__titles p { margin: 0; color: var(--dbw-text-3); font-size: 13px; max-width: 80ch; }
.as-card__actions { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.as-card__head:last-child { padding-bottom: 18px; }
.as-card__body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.as-card--flush .as-card__body { padding: 12px 0 4px; }

.as-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: inherit; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--dbw-border-strong); background: var(--dbw-surface); color: var(--dbw-text); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, box-shadow .12s; }
.as-btn:hover:not(:disabled) { background: var(--dbw-surface-2); }
.as-btn:focus-visible { outline: none; box-shadow: var(--as-ring); }
.as-btn:disabled { opacity: .5; cursor: not-allowed; }
.as-btn--primary { background: var(--dbw-primary); border-color: var(--dbw-primary); color: var(--dbw-on-primary); box-shadow: 0 1px 2px rgb(79 70 229 / .25); }
.as-btn--primary:hover:not(:disabled) { background: var(--dbw-primary-hover); }
.as-btn--ghost { border-color: transparent; background: transparent; color: var(--dbw-primary); }
.as-btn--ghost:hover:not(:disabled) { background: var(--dbw-primary-soft); }
.as-btn--danger { border-color: transparent; background: transparent; color: var(--dbw-danger); }
.as-btn--danger:hover:not(:disabled) { background: var(--dbw-danger-soft); }
.as-btn--sm { padding: 5px 10px; font-size: 12.5px; }

.as-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--dbw-surface-2); color: var(--dbw-text-2); white-space: nowrap; }
.as-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.as-pill--plain::before { display: none; }
.as-pill--ok { background: var(--dbw-success-soft); color: var(--dbw-success); }
.as-pill--warn { background: var(--dbw-warning-soft); color: var(--dbw-warning); }
.as-pill--bad { background: var(--dbw-danger-soft); color: var(--dbw-danger); }
.as-pill--info { background: var(--dbw-info-soft); color: var(--dbw-info); }
.as-pill--prim { background: var(--dbw-primary-soft); color: var(--dbw-primary-soft-text); }

.as-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.as-field__label { font-size: 12.5px; font-weight: 600; color: var(--dbw-text-2); }
.as-field__hint { font-size: 12px; color: var(--dbw-text-3); }
.as-input { width: 100%; font: inherit; color: var(--dbw-text); background: var(--dbw-surface); border: 1px solid var(--dbw-border-strong); border-radius: 9px; padding: 8px 11px; }
.as-input:focus { outline: none; border-color: var(--dbw-primary); box-shadow: var(--as-ring); }
select.as-input { padding-right: 28px; }
.as-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.as-mono { font-family: var(--dbw-font-mono); font-size: 12.5px; }
.as-muted { color: var(--dbw-text-3); font-size: 12.5px; }

.as-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--dbw-surface-2); border: 1px solid var(--dbw-border); width: fit-content; max-width: 100%; }
.as-seg__item { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 13px; border: 0; border-radius: 8px; background: transparent; color: var(--dbw-text-2); cursor: pointer; }
.as-seg__item[aria-checked="true"] { background: var(--dbw-surface); color: var(--dbw-text); font-weight: 600; box-shadow: 0 1px 2px rgb(15 23 42 / .1); }

.as-alert { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; border-radius: 11px; border: 1px solid transparent; font-size: 13px; }
.as-alert svg { flex: none; margin-top: 1px; }
.as-alert > div { flex: 1; min-width: 0; }
.as-alert--info { background: var(--dbw-info-soft); color: var(--dbw-text-2); border-color: color-mix(in srgb, var(--dbw-info) 22%, transparent); }
.as-alert--info svg { color: var(--dbw-info); }
.as-alert--warn { background: var(--dbw-warning-soft); color: var(--dbw-text-2); border-color: color-mix(in srgb, var(--dbw-warning) 25%, transparent); }
.as-alert--warn svg { color: var(--dbw-warning); }
.as-alert--bad { background: var(--dbw-danger-soft); color: var(--dbw-text-2); border-color: color-mix(in srgb, var(--dbw-danger) 25%, transparent); }
.as-alert--bad svg { color: var(--dbw-danger); }
.as-alert strong { display: block; color: var(--dbw-text); }

.as-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1240px) { .as-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.as-tile { text-align: left; font: inherit; color: inherit; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "icon label" "value value" "sub sub"; align-items: center; column-gap: 10px; row-gap: 4px; padding: 16px 18px; border-radius: var(--as-radius-lg); border: 1px solid var(--dbw-border); background: var(--dbw-surface); box-shadow: var(--dbw-shadow); cursor: pointer; text-decoration: none; transition: border-color .12s, transform .12s, box-shadow .12s; }
.as-tile:hover { border-color: color-mix(in srgb, var(--dbw-primary) 40%, var(--dbw-border)); transform: translateY(-1px); box-shadow: 0 6px 18px -10px rgb(15 23 42 / .25); }
.as-tile__icon { grid-area: icon; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--dbw-primary-soft); color: var(--dbw-primary); }
.as-tile__icon--bad { background: var(--dbw-danger-soft); color: var(--dbw-danger); }
.as-tile__icon--ok { background: var(--dbw-success-soft); color: var(--dbw-success); }
.as-tile__icon--warn { background: var(--dbw-warning-soft); color: var(--dbw-warning); }
.as-tile__label { grid-area: label; font-size: 12.5px; font-weight: 600; color: var(--dbw-text-3); }
.as-tile__value { grid-area: value; margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.as-tile__sub { grid-area: sub; font-size: 12.5px; color: var(--dbw-text-3); }

.as-steps { list-style: none; margin: 0; padding: 0; }
.as-step { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--dbw-border); }
.as-step:first-child { border-top: 0; }
.as-step__num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--dbw-surface-2); color: var(--dbw-text-2); border: 1px solid var(--dbw-border); }
.as-step--done .as-step__num { background: var(--dbw-success); color: #fff; border-color: transparent; }
.as-step--bad .as-step__num { background: var(--dbw-danger); color: #fff; border-color: transparent; }
.as-step__text { display: flex; flex-direction: column; min-width: 0; }
.as-step__text span { font-size: 12.5px; color: var(--dbw-text-3); }

.as-table-wrap { overflow-x: auto; }
.as-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.as-table th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--dbw-text-3); padding: 8px 20px; white-space: nowrap; }
.as-table td { padding: 12px 20px; border-top: 1px solid var(--dbw-border); vertical-align: middle; }
.as-table tbody tr:hover { background: var(--dbw-surface-2); }
.as-table tr.is-link { cursor: pointer; }
.as-doc { display: flex; flex-direction: column; min-width: 0; }
.as-doc strong { font-weight: 600; }
.as-doc span { font-size: 12.5px; color: var(--dbw-text-3); }
.as-row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.as-empty { margin: 0; padding: 22px 20px; color: var(--dbw-text-3); text-align: center; }
.as-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; margin: 0; }
.as-status dt { font-size: 11.5px; font-weight: 600; color: var(--dbw-text-3); text-transform: uppercase; letter-spacing: .03em; }
.as-status dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }

.as-toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 40px)); }
.as-toast { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 600; color: #fff; background: #0f172a; box-shadow: 0 10px 30px -10px rgb(15 23 42 / .5); animation: as-in .18s ease-out; }
.as-toast svg { color: #4ade80; flex: none; }

/* ── more of the settings app's parts (knowledge, models, SNS) ── */
.as-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.as-chip { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--dbw-border-strong); background: var(--dbw-surface); color: var(--dbw-text-2); }
.as-chip[aria-pressed="true"] { border-color: var(--dbw-primary); background: var(--dbw-primary-soft); color: var(--dbw-primary-soft-text); font-weight: 600; }
.as-toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; cursor: pointer; }
.as-toggle + .as-toggle { border-top: 1px solid var(--dbw-border); }
.as-toggle__text { display: flex; flex-direction: column; }
.as-toggle__label { font-weight: 600; }
.as-switch { position: relative; width: 40px; height: 23px; flex: none; }
.as-switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.as-switch__track { position: absolute; inset: 0; border-radius: 999px; background: var(--dbw-surface-3); transition: background .15s; }
.as-switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
.as-switch input:checked + .as-switch__track { background: var(--dbw-primary); }
.as-switch input:checked + .as-switch__track::after { transform: translateX(17px); }
.as-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.as-actions__buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.as-test { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.as-test--ok { color: var(--dbw-success); }
.as-methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.as-method { position: relative; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 12px; border: 1.5px solid var(--dbw-border); background: var(--dbw-surface); cursor: pointer; transition: border-color .12s, background .12s; }
.as-method:hover { border-color: var(--dbw-border-strong); }
.as-method[aria-checked="true"] { border-color: var(--dbw-primary); background: color-mix(in srgb, var(--dbw-primary-soft) 55%, var(--dbw-surface)); box-shadow: 0 0 0 1px var(--dbw-primary) inset; }
.as-method[aria-disabled="true"] { opacity: .6; }
.as-method__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.as-method__icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--dbw-surface-2); color: var(--dbw-text-2); }
.as-method[aria-checked="true"] .as-method__icon { background: var(--dbw-primary); color: var(--dbw-on-primary); }
.as-method__radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dbw-border-strong); }
.as-method[aria-checked="true"] .as-method__radio { border: 5px solid var(--dbw-primary); }
.as-method__title { font-weight: 700; font-size: 14.5px; }
.as-method__desc { font-size: 13px; color: var(--dbw-text-2); flex: 1; }
.as-method__tag { align-self: flex-start; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--dbw-surface-2); color: var(--dbw-text-3); }
.as-inline { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 14px; border-radius: 11px; background: var(--dbw-surface-2); }
.as-inline__label { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; color: var(--dbw-text-2); }
.as-drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; border-radius: 12px; border: 1.5px dashed var(--dbw-border-strong); background: var(--dbw-surface-2); text-align: center; color: var(--dbw-text-2); }
.as-drop__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--dbw-surface); color: var(--dbw-primary); border: 1px solid var(--dbw-border); margin-bottom: 4px; }
.as-tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--dbw-surface-2); color: var(--dbw-text-2); border: 1px solid var(--dbw-border); }
.as-code pre { margin: 0; padding: 16px; border-radius: 11px; background: #0f172a; color: #e2e8f0; font-family: var(--dbw-font-mono); font-size: 12.5px; line-height: 1.6; overflow: auto; }
.hub-im { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.hub-im__item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--dbw-border); background: var(--dbw-surface); }
.hub-im__item .as-doc { flex: 1; }

// ── helpers ──
const STATUS = { running: ['ok', '运行中'], stopped: ['plain', '已停止'], failed: ['bad', '故障'], registered: ['info', '未上线'], starting: ['warn', '启动中'], stopping: ['warn', '停止中'] }
const pill = (s) => `<span class="as-pill as-pill--${STATUS[s][0]}">${STATUS[s][1]}</span>`
const mark = (a, s = 34) => `<div class="hub-agent__mark" aria-hidden="true" style="background:${COLORS[a.color]};width:${s}px;height:${s}px">${a.name[0]}</div>`
const find = (id) => agents.find((a) => a.id === id)
const pendingReleases = () => Object.entries(releases).flatMap(([id, rs]) => rs.filter((r) => r.status === 'passed').map((r) => ({ id, ...r })))
const card = ({ icon: ic, title, sub = '', actions = '', body = '', flush = false }) => `

    <div class="as-card__body">${body}</div>
  </section>`
const tile = (ic, label, value, sub, href, tone = '') => `<a class="as-tile" href="${href}"><span class="as-tile__icon${tone ? ' as-tile__icon--' + tone : ''}">${icon(ic, 16)}</span><span class="as-tile__label">${label}</span><span class="as-tile__value">${value}</span><span class="as-tile__sub">${sub}</span></a>`
const head = (eyebrow, title, desc, actions = '') => `<div class="as-page-head"><div><div class="as-page-head__eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions ? `<div class="as-page-head__actions">${actions}</div>` : ''}</div>`
function toast(text) {
  const t = document.createElement('div'); t.className = 'as-toast'; t.innerHTML = icon('check', 16) + text
  document.getElementById('toasts').append(t); setTimeout(() => t.remove(), 2600)
}
function modal(html) {
  const root = document.getElementById('modal-root')
  root.innerHTML = `<div class="hub-modal" role="dialog" aria-modal="true">${html}</div>`
  root.querySelector('.hub-modal').addEventListener('click', (e) => { if (e.target.classList.contains('hub-modal') || e.target.closest('[data-close]')) root.innerHTML = '' })
}
const closeModal = () => { document.getElementById('modal-root').innerHTML = '' }

// ── nav ──

    <div class="as-tiles">

      ${tile('alert', '故障', failed.length, failed.map((a) => a.name).join('、') || '没有', '#/agents', failed.length ? 'bad' : '')}
      ${tile('box', '待批准的版本', pend.length, '需要第二个人批准', '#/releases', pend.length ? 'warn' : '')}
      ${tile('cpu', '内存（运行中的 cell）', `${(mem / 1024).toFixed(1)} GB`, `${running} 个 cell · 主机 8 GB`, '#/agents')}
    </div>
    ${card({ icon: 'bell', title: '需要处理', sub: '故障、积压和等你决定的事。', flush: true, body: `<ol class="as-steps">
      ${failed.map((a) => `<li class="as-step as-step--bad"><span class="as-step__num">!</span><span class="as-step__text"><strong>${a.name}：健康检查连续失败</strong><span>11-16 08:02 起 · outbox 积压 ${a.outbox} · 成员同步中断</span></span><span class="as-pill as-pill--bad">故障</span><a class="as-btn as-btn--ghost" href="#/agents/${a.id}/logs">${icon('arrow', 15)}看日志</a></li>`).join('')}

    </ol>` })}

function agentsTable() {
  return card({ icon: 'sparkle', title: 'Agents', sub: '每个 agent 是一个独立的 cell：业务进程 + DSH + 自己的数据库、bot 和密钥。', actions: `<button class="as-btn as-btn--primary" data-act="register">${icon('plus', 16)}登记 agent</button>`, flush: true, body: `
    <div class="as-table-wrap"><table class="as-table"><thead><tr><th>Agent</th><th>状态</th><th>版本</th><th>成员</th><th>健康</th><th></th></tr></thead><tbody>
    ${agents.map((a) => `<tr class="is-link" data-go="#/agents/${a.id}">
      <td><div class="hub-agent">${mark(a)}<div class="as-doc"><strong>${a.name}</strong><span class="as-mono">${a.id}</span></div></div></td>

function runButtons(a, small = false) {
  const sm = small ? ' as-btn--sm' : ''
  if (a.status === 'running') return `<button class="as-btn${sm}" data-act="restart" data-id="${a.id}">${icon('refresh', 14)}重启</button><button class="as-btn as-btn--danger${sm}" data-act="stop" data-id="${a.id}">${icon('stop', 14)}停止</button>`
  if (a.status === 'stopped' || a.status === 'failed') return `<button class="as-btn as-btn--primary${sm}" data-act="start" data-id="${a.id}">${icon('play', 14)}${a.status === 'failed' ? '重启' : '启动'}</button>`
  if (a.status === 'registered') return `<button class="as-btn${sm}" disabled title="还没有已批准的版本">${icon('play', 14)}启动</button>`
  return `<button class="as-btn${sm}" disabled><span>${STATUS[a.status][1]}…</span></button>`
}

function checksHtml(c) {
  const item = (label, v) => { const ok = v === true || (typeof v === 'string' && (!v.includes('/') || v.split('/')[0] === v.split('/')[1]) && !(label === 'evals' && parseFloat(v) < 0.8)); return `<span class="hub-check ${ok ? 'hub-check--ok' : 'hub-check--bad'}">${ok ? icon('check', 13) : icon('x', 13)}${label}${v === true || v === false ? '' : ' ' + v}</span>` }
  return `<div class="hub-checks">${item('manifest', c.manifest)}${item('角色映射', c.roles)}${item('一致性', c.conformance)}${item('业务测试', c.tests)}${item('evals', c.evals)}${item('profile', c.profile)}${item('沙箱场景', c.scenarios)}</div>`
}
function releaseRows(list, agentId) {
  return list.map((r) => {
    const id = agentId || r.id
    const st = r.status === 'approved' ? (r.live ? '<span class="as-pill as-pill--ok">运行中</span>' : '<span class="as-pill as-pill--plain">已批准</span>') : r.status === 'passed' ? '<span class="as-pill as-pill--warn">待批准</span>' : '<span class="as-pill as-pill--bad">检查未通过</span>'

      : r.status === 'failed' ? `<a class="as-btn as-btn--ghost as-btn--sm" href="#/agents/${id}/logs">${icon('terminal', 14)}检查日志</a>` : ''
    return `<tr><td style="min-width:170px"><div class="as-doc"><strong>${agentId ? '' : find(id).name + ' · '}<span class="as-mono">${r.sha}</span></strong><span>${r.msg}</span></div></td>

  }).join('')
}

    <div class="as-pages">

const kn = { method: 'bm25f' }
function agentKnowledge(a) {
  const list = docs[a.id] || (docs[a.id] = [{ id: 'rules', title: `${a.name}的规定`, src: 'base', by: '—', at: '11-10', status: 'published', chunks: 8 }, { id: 'faq', title: '常见问题', src: 'base', by: '—', at: '11-10', status: 'published', chunks: 6 }])
  const pub = list.filter((d) => d.status === 'published'), pend = list.filter((d) => d.status === 'pending')
  const chunks = pub.reduce((n, d) => n + d.chunks, 0)
  const method = (v, ic, t, d, tag, disabled) => `<button class="as-method" role="radio" aria-checked="${kn.method === v}" ${disabled ? 'aria-disabled="true" data-act="kn-locked"' : `data-act="kn-method" data-v="${v}"`}><span class="as-method__top"><span class="as-method__icon">${icon(ic, 17)}</span><span class="as-method__radio"></span></span><span class="as-method__title">${t}</span><span class="as-method__desc">${d}</span><span class="as-method__tag">${tag}</span></button>`
  return `<div class="as-tiles">

    ${card({ icon: 'settings', title: 'cell', sub: '这些值由 Hub 在启动时注入（环境变量），不写在 agent.json 里。', body: `<div>${[['子域名（给使用者）', `<span class="as-mono">${a.id}.agents.example.net</span>`], ['公开的路径', '<span class="as-mono">/me/sns</span>、业务画面、<span class="as-mono">/sso/callback</span>、webhook'], ['管理 API', '<span class="as-mono">/hub-agent/v1/admin/*</span>（只在内网端口）'], ['runner', 'process（第一阶段）'], ['OS 用户', `<span class="as-mono">agent-${a.id}</span>`], ['数据库', `<span class="as-mono">agent_${a.id.replace(/-/g, '_')}</span>`], ['DSH profile', '<span class="as-mono">dsh-profile</span> · DSH 0.2.2-rc.1'], ['dsh.allow（打开的外发）', '无']].map(([k, v]) => `<div class="hub-kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div>` })}
    ${card({ icon: 'key', title: '密钥和环境变量', sub: '值放在属于这个 agent 的 OS 用户的 0600 文件里，画面上只显示「已设置」。', body: `<div>${[['BRIDGE_SERVICE_TOKEN', 'Hub 生成'], ['HUB_CLIENT_SECRET', 'Hub 生成'], ['DATABASE_URL', 'Hub 生成'], ['AGENT_SETTINGS_KEY', '已设置'], ['AZURE_OPENAI_KEY（可选）', '<span class="hub-no">未设置</span>']].map(([k, v]) => `<div class="hub-kv"><span class="as-mono">${k}</span><span>${v.startsWith('<') ? v : `<span class="hub-yes">${v}</span>`}</span></div>`).join('')}</div>` })}
    </div>`
}

function pageAgents() { return head('Agent Hub', 'Agents', '公司的 AI agent。代码在 biz-ai-agents 仓库里，用 agent-builder skill 造出来；这里登记、检查、批准、启停、测试和调试。') + `<div class="as-pages">${agentsTable()}</div>` }

function pageReleases() {
  const pend = pendingReleases()
  const recent = Object.entries(releases).flatMap(([id, rs]) => rs.filter((r) => r.status !== 'passed').map((r) => ({ id, ...r })))
  return head('Agent Hub', '版本审批', '检查全部通过的版本，要由登记人以外的管理者或平台管理员批准后才能上线。批准前请看检查结果和 diff。') + `<div class="as-pages">
    ${card({ icon: 'box', title: `待批准（${pend.length}）`, flush: true, body: pend.length ? `<div class="as-table-wrap"><table class="as-table"><thead><tr><th>版本</th><th>登记</th><th>检查</th><th>状态</th><th></th></tr></thead><tbody>${releaseRows(pend)}</tbody></table></div>` : '<p class="as-empty">没有待批准的版本。</p>' })}
    ${card({ icon: 'clock', title: '最近的版本', flush: true, body: `<div class="as-table-wrap"><table class="as-table"><thead><tr><th>版本</th><th>登记</th><th>检查</th><th>状态</th><th></th></tr></thead><tbody>${releaseRows(recent)}</tbody></table></div>` })}
  </div>`
}

let acctTab = 'manager'
function pageAccounts() {
  const list = accounts.filter((a) => a[1] === acctTab)
  const st = { active: '<span class="as-pill as-pill--ok">有效</span>', disabled: '<span class="as-pill as-pill--plain">已停用</span>', invited: '<span class="as-pill as-pill--info">已邀请</span>' }
  return head('平台管理员', '账号', '两种账号：管理者（创建和管理 agent）和使用者（agent 的成员）。种类创建后不能改；账号 ID 永久，删除是软删除。') + `<div class="as-pages">
    ${card({ icon: 'users', title: '账号', actions: `<div class="as-seg" role="radiogroup">${[['manager', '管理者'], ['user', '使用者']].map(([v, l]) => `<button class="as-seg__item" role="radio" aria-checked="${acctTab === v}" data-act="acct-tab" data-v="${v}">${l}</button>`).join('')}</div><button class="as-btn as-btn--primary" data-act="new-account">${icon('plus', 16)}${acctTab === 'manager' ? '新建管理者' : '邀请使用者'}</button>`, flush: true,
      body: `<div class="as-table-wrap"><table class="as-table"><thead><tr><th>名字</th><th>登录 ID</th><th>${acctTab === 'manager' ? '负责的 agent' : '加入的 agent'}</th><th>状态</th><th></th></tr></thead><tbody>${list.map(([n, k, adm, id, s, c]) => `<tr><td><strong>${n}</strong>${adm ? ' <span class="as-pill as-pill--prim as-pill--plain">平台管理员</span>' : ''}</td><td class="as-mono">${id}</td><td>${c}</td><td>${st[s]}</td><td><div class="as-row-actions">${s === 'active' && n !== ME.name ? '<button class="as-btn as-btn--danger as-btn--sm" data-act="disable">停用</button>' : ''}</div></td></tr>`).join('')}</tbody></table></div>` })}
    <div class="as-alert as-alert--info">${icon('shield')}<div>停用账号时：Hub 会话失效，并通知所有相关的 agent（作废会话、解除 SNS 连携、撤回他发起的未决审批）。一个人既是管理者又是使用者时，用两个账号（§17 决定 2，待定）。</div></div>
  </div>`
}

function pageAudit() {
  return head('平台管理员', '审计', '谁在什么时候启停、登记、批准、加人、改设置。只记 ID 和数字，没有自由文。') + `<div class="as-pages">${card({ icon: 'list', title: '审计记录', flush: true, body: `<div class="as-table-wrap"><table class="as-table"><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>Agent</th><th>内容</th></tr></thead><tbody>${audit.map(([t, w, a, g, x]) => `<tr><td class="as-mono">${t}</td><td>${w}</td><td><strong>${a}</strong></td><td class="as-mono">${g}</td><td class="as-muted">${x}</td></tr>`).join('')}</tbody></table></div>` })}</div>`
}

// ── router ──
function render() {
  const route = location.hash || '#/'
  renderNav(route)
  const m = route.match(/^#\/agents\/([^/]+)(?:\/([a-z]+))?/)
  const main = document.getElementById('main')
  main.innerHTML = m ? pageAgent(m[1], m[2] || '') : route === '#/agents' ? pageAgents() : route === '#/releases' ? pageReleases() : route === '#/accounts' ? pageAccounts() : route === '#/audit' ? pageAudit() : pageOverview()
  const form = document.getElementById('sb-form')
  if (form) form.addEventListener('submit', (e) => { e.preventDefault(); const t = document.getElementById('sb-text'); if (!t.value.trim()) return; sbSend(t.value.trim()); t.value = ''; refreshLog() })
  const log = document.getElementById('sb-log'); if (log) log.scrollTop = log.scrollHeight
}
function refreshLog() { const log = document.getElementById('sb-log'); if (log) { log.innerHTML = sbLog(); log.scrollTop = log.scrollHeight } }
addEventListener('hashchange', () => { render(); scrollTo(0, 0) })

function transition(a, mid, end, msg) {
  a.status = mid; render()
  setTimeout(() => { a.status = end; if (end === 'running') { a.uptime = '刚刚'; a.mem = 305; a.errors = 0; a.sync = 'ok'; a.outbox = 0 } else { a.uptime = '—'; a.mem = 0 } render(); toast(msg) }, 1100)
}

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]'); const b = e.target.closest('[data-act]')
  if (go && !b) { location.hash = go.dataset.go; return }
  if (!b) return
  const act = b.dataset.act, a = b.dataset.id && find(b.dataset.id)
  if (act === 'stop') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('stop')}</div><div class="as-card__titles"><h2>停止「${a.name}」？</h2><p>${a.members} 个成员会无法使用。</p></div></div><div class="as-card__body">
      <div>${['网页显示「这个 agent 已停止」', 'outbox 里没送出的事件留在数据库，启动后接着送', 'LINE webhook 回 503；没开「Webhook 再送」时，停止期间的消息会丢', '自动任务、定时报告停止，启动后不补跑'].map((t) => `<div class="hub-kv"><span>${t}</span><span></span></div>`).join('')}</div>
      <div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="stop-ok" data-id="${a.id}" style="background:var(--dbw-danger);border-color:var(--dbw-danger)">${icon('stop', 15)}停止</button></div></div></section>`)
  else if (act === 'stop-ok') { closeModal(); transition(a, 'stopping', 'stopped', `「${a.name}」已停止`) }
  else if (act === 'start') transition(a, 'starting', 'running', `「${a.name}」已启动（健康检查通过）`)
  else if (act === 'restart') transition(a, 'starting', 'running', `「${a.name}」已重启`)
  else if (act === 'approve') { const r = releases[b.dataset.id].find((x) => x.sha === b.dataset.sha); r.status = 'approved'; r.approved = ME.name; if (find(b.dataset.id).status === 'registered') find(b.dataset.id).release = r.sha; render(); toast(`已批准 ${r.sha}`) }
  else if (act === 'deploy') { const rs = releases[b.dataset.id]; rs.forEach((x) => { x.live = x.sha === b.dataset.sha }); find(b.dataset.id).release = b.dataset.sha; transition(find(b.dataset.id), 'starting', 'running', `已切换到 ${b.dataset.sha}`) }
  else if (act === 'invite') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('users')}</div><div class="as-card__titles"><h2>加入成员</h2><p>只能加使用者账号。管理者账号不能成为成员。</p></div></div><div class="as-card__body">
      <label class="as-field"><span class="as-field__label">已有的使用者</span><select class="as-input"><option>小林 由美</option><option>中村 大辅</option></select></label>
      <div class="as-muted" style="text-align:center">或者</div>
      <label class="as-field"><span class="as-field__label">邀请新的使用者（登录 ID）</span><input class="as-input" placeholder="例：suzuki"><span class="as-field__hint">生成邀请链接，交给本人；本人设密码后自动加入。第一阶段不发邮件。</span></label>
      <div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="invite-ok">${icon('check', 15)}加入</button></div></div></section>`)
  else if (act === 'invite-ok') { closeModal(); toast('已加入（mock）') }
  else if (act === 'remove') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('users')}</div><div class="as-card__titles"><h2>移除「${b.dataset.name}」？</h2><p>他的会话立即作废，SNS 连携解除，他发起的未决审批撤回。</p></div></div><div class="as-card__body"><div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="remove-ok" style="background:var(--dbw-danger);border-color:var(--dbw-danger)">移除</button></div></div></section>`)
  else if (act === 'remove-ok') { closeModal(); toast('已移除，已通知 agent（mock）') }
  else if (act === 'doc-approve' || act === 'doc-reject' || act === 'doc-withdraw') {
    const d = docs[b.dataset.id].find((x) => x.id === b.dataset.doc)
    if (act === 'doc-approve') { d.status = 'published'; d.chunks = 4; toast('已批准，索引已重建（4 个区块）') } else if (act === 'doc-reject') { d.status = 'rejected'; toast('已驳回') } else { d.status = 'withdrawn'; d.chunks = 0; toast('已撤下，索引已重建') }
    render()
  }
  else if (act === 'kn-method') { kn.method = b.dataset.v; render() }
  else if (act === 'kn-locked') toast('现在只用 BM25F；要先在「模型」页配好模型')
  else if (act === 'kn-upload') { docs[location.hash.split('/')[2]].push({ id: 'new-' + Date.now().toString(36).slice(-4), title: '新上传的文档（mock）', src: 'upload', by: ME.name, at: '11-16', status: 'pending', chunks: 0 }); render(); toast('已上传，等待另一位管理者批准') }
  else if (act === 'kn-rebuild') toast('索引已重建：文档 6 · 区块 30 · 拒绝 0（报告已发给管理者）')
  else if (act === 'model-test') { const el = document.getElementById(b.dataset.v); el.innerHTML = icon('check', 15) + 'OK · 412 ms' }
  else if (act === 'model-save') toast('已保存到 agent（重启后生效）')
  else if (act === 'model-key') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('key')}</div><div class="as-card__titles"><h2>更换 API key</h2><p>直接交给 agent，用它的 AGENT_SETTINGS_KEY 加密保存；Hub 不保存，也不记日志。</p></div></div><div class="as-card__body"><div class="as-seg" role="radiogroup"><button class="as-seg__item" role="radio" aria-checked="true">环境变量名（推荐）</button><button class="as-seg__item" role="radio" aria-checked="false">直接输入 key</button></div><label class="as-field"><span class="as-field__label">环境变量名</span><input class="as-input as-mono" placeholder="例：EXPENSE_LLM_KEY"><span class="as-field__hint">值由运维放进这个 agent 的密钥文件</span></label><div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="model-key-ok">保存</button></div></div></section>`)
  else if (act === 'model-key-ok') { closeModal(); toast('已保存到 agent') }
  else if (act === 'model-overlay') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('file')}</div><div class="as-card__titles"><h2>DSH overlay</h2><p>由 agent 生成；key 只写环境变量名。</p></div></div><div class="as-card__body"><div class="as-code"><pre>llm-pi-ai:
  providers:
    biz-base:
      api: openai-completions
      baseUrl: https://api.deepseek.com/v1
      apiKeyEnv: AGENT_BASE_MODEL_KEY
      models:
        - id: deepseek-chat
agent-default-model:
  provider: biz-base
  model: deepseek-chat</pre></div><div class="hub-modal__foot"><button class="as-btn" data-close>关闭</button></div></div></section>`)
  else if (act === 'im') imModal(b.dataset.v)
  else if (act === 'im-ok') { closeModal(); const a2 = find(location.hash.split('/')[2]); if (a2) a2.bots[b.dataset.v] = true; render(); toast(`${b.dataset.v} 已连接（mock）`) }
  else if (act === 'register' || act === 'register-release') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('box')}</div><div class="as-card__titles"><h2>${act === 'register' ? '登记 agent' : '登记版本'}</h2><p>从 biz-ai-agents 仓库取出这个 commit，安装依赖，在 agent 自己的 OS 用户下跑全部检查。</p></div></div><div class="as-card__body">
      ${act === 'register' ? '<label class="as-field"><span class="as-field__label">目录</span><input class="as-input as-mono" value="agents/purchase-requests"><span class="as-field__hint">id 取 agent.json 的 id（= manifest 的 system.id）</span></label>' : ''}
      <label class="as-field"><span class="as-field__label">commit</span><input class="as-input as-mono" value="main（c0ffee1）"></label>
      <div class="as-alert as-alert--info">${icon('terminal')}<div>同样可以用 CLI：<span class="as-mono">biz-agent register ${a ? a.id : 'purchase-requests'} --ref c0ffee1</span></div></div>
      <div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="register-ok">${icon('play', 15)}登记并检查</button></div></div></section>`)
  else if (act === 'register-ok') { closeModal(); toast('已登记，检查开始（mock）') }
  else if (act === 'sb-model') {
    if (b.dataset.v === 'real') modal(`<section class="as-card"><div class="as-card__head"><div class="as-card__icon">${icon('alert')}</div><div class="as-card__titles"><h2>用真实模型？</h2><p>系统提示和这个 agent 的知识文档（内部规定）会发给模型。只能用这个 agent 已批准的模型连接，会花 token。</p></div></div><div class="as-card__body"><div class="hub-kv"><span>模型连接</span><span>Azure OpenAI（日本东部）</span></div><div class="hub-kv"><span>估算</span><span>每次对话约 3,000 token</span></div><div class="hub-modal__foot"><button class="as-btn" data-close>取消</button><button class="as-btn as-btn--primary" data-act="sb-real-ok">我确认外发</button></div></div></section>`)
    else { sb.model = 'mock'; render() }
  }
  else if (act === 'sb-real-ok') { closeModal(); sb.model = 'real'; render() }
  else if (act === 'sb-start') { sb.running = true; sb.items = []; render(); toast('沙箱已启动（临时库 + seed + 假 Hub + mock LINE）') }
  else if (act === 'sb-stop') { sb.running = false; sb.items = []; render(); toast('沙箱已停止并删除') }
  else if (act === 'sb-reset') { sb.items = []; refreshLog(); toast('数据已重置为 seed') }
  else if (act === 'sb-user') { sb.user = b.dataset.v; render() }
  else if (act === 'sb-decide') {
    const id = b.dataset.id, u = b.dataset.u
    const cards = sb.items.filter((x) => x.k === 'card' && x.id === id)
    if (cards.some((c) => c.done)) return
    const word = b.dataset.v === 'approve' ? '已承认' : '已驳回'
    cards.forEach((c) => { c.done = c.u === u ? `${word}（你）` : `${TEST_USERS[u].replace('（虚构）', '')} ${word}` })
    const from = cards[0].from
    sb.items.push({ k: 'bot', u: from, t: `你的报销申请 ${id} ${word}。\n— 报销（AI 秘书）` })
    refreshLog()
  }
  else if (act === 'sb-run') {
    const lis = [...document.querySelectorAll('#sb-scen .as-step')]
    lis.forEach((li, i) => { li.querySelector('.as-pill').className = 'as-pill as-pill--warn'; li.querySelector('.as-pill').textContent = '运行中'
      setTimeout(() => { li.classList.add('as-step--done'); li.querySelector('.as-step__num').innerHTML = icon('check', 14); const p = li.querySelector('.as-pill'); p.className = 'as-pill as-pill--ok'; p.textContent = '通过'; if (i === lis.length - 1) toast(`场景 ${lis.length}/${lis.length} 通过`) }, 500 + i * 380) })
  }
  else if (act === 'trace') document.getElementById('trace-box').innerHTML = traceCard(b.dataset.v)
  else if (act === 'trace-close') document.getElementById('trace-box').innerHTML = ''
  else if (act === 'acct-tab') { acctTab = b.dataset.v; render() }
  else if (act === 'new-account') toast(acctTab === 'manager' ? '只有平台管理员能新建管理者（mock）' : '已生成邀请链接（mock）')
  else if (act === 'disable') toast('已停用，已通知相关的 agent（mock）')
  else if (act === 'noop') toast('已刷新（mock）')
})
// ?demo=sandbox: a running sandbox with one claim approved by B (for screenshots)
if (new URLSearchParams(location.search).get('demo') === 'sandbox') {
  sb.running = true; sbSend('交通费 3,200 日元，11 月 14 日去客户那里'); sbSend('报销规定的交通费有上限吗？')
  const c = sb.items.find((x) => x.k === 'card' && x.u === 'B')
  sb.items.filter((x) => x.k === 'card' && x.id === c.id).forEach((x) => { x.done = x.u === 'B' ? '已承认（你）' : '测试用户 B 已承认' })
  sb.items.push({ k: 'bot', u: 'A', t: `你的报销申请 ${c.id} 已承认。\n— 报销（AI 秘书）` })
  sb.user = 'B'
}
render()
</script>
